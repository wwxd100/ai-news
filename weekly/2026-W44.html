const source = "# AI 周报 · 2026-W44（10 月 26 日–11 月 1 日，资料不完整）\n\n[中文（当前）](2026-W44.md) · [English](../en/weekly/2026-W44.md)\n\n- **编制时间：** 2026-11-03；周期已结束，资料不完整。\n- **范围：** 本周仅有[10 月 26 日补档](../daily/2026-10/2026-10-26.md)、[10 月 27 日延迟版](../daily/2026-10/2026-10-27.md)，以及[11 月 2 日补档](../daily/2026-11/2026-11-02.md)中明确标为 10 月 28–31 日发布的材料。10 月 28–31 日及 11 月 1 日未形成独立日报，不能以缺档推断无新闻。\n\n## 一周关键结论\n\n1. **模型成本与图形界面能力同步竞争。** GPT-6.1 Terra 已列出 API 与价格，性能仍为厂商自评；应以完成任务费用和恢复能力验收。\n2. **世界模型出现新研究预览。** Genie 4 支持互动与原生音频，但官方承认长时漂移，距离成熟 AI 游戏仍有验证距离。\n3. **资本与科研声明都进入公开复核期。** Anthropic S-1 可在 SEC 索引核对，发行尚未生效；OpenAI 的数学/物理成果需要学界独立审阅。\n4. **专业 Agent 与治理边界收紧。** ServiceNow 工作流连接、Rosalind 限量预览、Model Spec 更新和训练偏好信号分别涉及执行权限、准入、安全和网站选择。\n\n```mermaid\nflowchart LR\n  A[\"本周有据可查的发布\"] --> B[\"区分交付、预览与声明\"]\n  B --> C[\"独立任务与外部审阅\"]\n  D[\"日报缺口\"] --> C\n```\n\n## 趋势、反证与下一周期信号\n\n| 趋势 | 本周观察 | 仍未成立或反证 | 下一周期信号 |\n| --- | --- | --- | --- |\n| T01/T03 模型与 Agent | Terra、ServiceNow、Rosalind 增加任务及垂直入口 | 厂商榜分、合作与限量预览不等于可普遍部署 | 真实任务成功率、权限和费用 |\n| T02/T05 世界模型 | Genie 4 可信测试者预览 | 官方承认长时物体与场景漂移 | 长时玩家测试、输入延迟、单位分钟成本 |\n| T07 治理 | 训练偏好信号、Model Spec 更新、专业模型准入 | 支持信号尚待实施；政策文本非统一行业效果 | 实施范围、独立审计与事故率 |\n| T08/T09 资本与科研 | S-1 申报、AI 辅助科研声明 | 未上市；形式化材料不等于学界接受 | 招股书后续、专家公开评注 |\n\n## 被证伪判断与方法限制\n\n- **不成立：** “Anthropic 已上市”；SEC 记录的是拟议 IPO 的 S-1，注册声明尚未生效。\n- **仍未成立：** “Genie 4 已可稳定支撑长时成熟游戏”；官方列出了长时一致性限制。\n- **仍未成立：** “AI 已得到公认的 ETH 或量子场论结论”；外部审阅尚在进行。\n- 本周采集缺口较大，本报告只概括有据可查的材料，不统计事件量或地域占比。\n";

root.innerHTML = marked.parse(source);
root.querySelectorAll("pre > code.language-mermaid").forEach((code) => {
  const div = document.createElement("div");
  div.className = "mermaid";
  div.textContent = code.textContent;
  code.parentElement.replaceWith(div);
});
const dark = matchMedia("(prefers-color-scheme: dark)").matches;
mermaid.initialize({ startOnLoad: false, theme: dark ? "dark" : "default", securityLevel: "strict" });
for (const el of root.querySelectorAll(".mermaid")) {
  try { await mermaid.run({ nodes: [el] }); }
  catch (e) { el.classList.add("mermaid-error"); el.textContent = "Mermaid \u8bed\u6cd5\u9519\u8bef\uff1a" + e.message; }
}
document.body.dataset.rendered = "true";
