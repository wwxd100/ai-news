h announcement; [official report](https://deepmind.google/blog/opening-the-datasets-behind-our-ai-weather-models/) · [paper and data entry point](https://developers.google.com/earth-engine/datasets).\n- **Corroboration / confidence:** Public data access can be inspected. Accuracy comparisons are publisher-run, with no independent replication here. Delivery: high confidence; performance awaits validation.\n- **Trend:** T02/T06 first tracked here; missed November 13 item.\n\n## Tracking and limitations\n\n- **To verify:** Actual delivery after yesterday's NVIDIA leadership change, Gemini Wallet permissions, and independent regional quality checks for these datasets.\n- **Coverage limit:** A short edition means this scan found too few major incremental items. It does not imply that no AI news occurred anywhere.\n";
