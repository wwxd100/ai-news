const source = "# AI Daily Brief · 2026-11-25\n\n[English (current)](2026-11-25.md) · [中文](../../../daily/2026-11/2026-11-25.md)\n\n- **Collection cutoff:** November 25, 2026, 11:00 Asia/Shanghai. Most items were published November 24. Marlowe is a November 23 catch-up, deduplicated against the [previous brief](2026-11-24.md). [Index](../../INDEX.md) · [Trend tracker](../../../TRACKERS.md). Exact times are not inferred from date-only sources.\n- **Selection:** Seven verifiable developments. No independently checked new playable game world model was delivered in this window; old demos and reposts were not added to reach 20 items.\n\n## Key conclusions\n\n1. **General-purpose models entered protein-design workflows, but have not replaced specialized models end to end.** OpenAI reported that 35 of 322 GPT-6.2-derived minibinders showed binding across five targets in laboratory tests. Specialized models still supplied sequences and filtered candidates. Binding is not therapeutic efficacy.\n2. **Reliability evaluation is starting to test repetition and small variations.** Google launched Humanity’s First Exam with 544 basic text and image prompts across 20 capabilities. Its scores do not yet establish reliability in actual business workflows.\n3. **Debate about whether frontier models can be released safely is intensifying, while claims about internal capabilities remain anonymous-source reports.** Axios interviewed more than two dozen people familiar with the debate; OpenAI and Anthropic responded about their processes. The report does not establish that unreleased models have escaped control.\n4. **Agent value is moving toward data-job scheduling and auditable task costs.** Zipher disclosed a new $45 million round; $53 million is the cumulative figure including an earlier seed round. Marlowe disclosed a $277 million seed round the previous day and aims to match chips to inference workloads. Both cost-savings claims and delivery capacity need customer-side checks.\n5. **Embodied and scientific agents have executable examples, with different verification levels.** NVIDIA documented a Microduck simulation-to-robot avoidance workflow. OpenAI described Codex/Astra-assisted searches for exoplanet candidates, which are not confirmed planets.\n\n```mermaid\nflowchart LR\n  A[\"Vendor studies and releases\"] --> B[\"Test conditions, financing definitions and access\"]\n  B --> C[\"Independent replication or external confirmation\"]\n  C --> D[\"Product, editorial and investment decisions\"]\n```\n\n## High-signal developments\n\n### 1. OpenAI reports GPT-6 family protein-design experiments\n\n- **What happened:** OpenAI and Onava tested GPT-6.2-derived designs in the lab. Of 322 minibinders across five targets, 35 showed positive binding. Specialized models including SolubleMPNN still proposed sequences and filtered candidates. The paper explicitly does not establish end-to-end, zero-shot design without specialized models.\n- **Why it matters / lens:** Product decisions, investment monitoring and technical context. General-purpose models can contribute structure drafts and constraint reasoning, but scientific products need separate acceptance stages for candidate generation, wet-lab testing, biological activity and safety.\n- **Publication / type / original source:** November 24, 2026, OpenAI [research article and paper link](https://openai.com/index/gpt-6-models-demonstrate-intrinsic-protein-design-capabilities/), company research and partner experiments.\n- **Corroboration / confidence:** The experiments are reported by the collaborating team; independent replication is absent. High confidence in publication and stated method limits; generalization and therapeutic value remain unverified.\n- **Trend:** T01/T07, continuing rise; general-purpose model science moves from computational benchmarks to limited wet-lab tests.\n\n### 2. Google launches the Humanity’s First Exam reliability benchmark\n\n- **What happened:** Google DeepMind launched HFE on Kaggle with 544 basic text and image prompts spanning 20 capabilities. It emphasizes repeated correctness on the same task and small variants and invites community questions through December 15.\n- **Why it matters / lens:** Product decisions, editorial planning and technical context. Agent and content-review teams should measure failures across repeated runs and boundary variations; one success or leaderboard score does not establish stable delivery.\n- **Publication / type / original sources:** November 24, 2026, Google's [official introduction](https://blog.google/innovation-and-ai/models-and-research/google-deepmind/humanitys-first-exam/) and its linked technical report and Kaggle leaderboard, publisher research materials.\n- **Corroboration / confidence:** The dataset and entry points are inspectable. Its predictive value for real workflows has not been independently established. High confidence in the release; utility awaits replication.\n- **Trend:** T01/T07, first appearance; evaluation moves from one-off capability to repeated reliability.\n\n### 3. Axios reports a frontier-lab dispute over unreleased model safety\n\n- **What happened:** Axios says it interviewed more than two dozen people familiar with discussions at OpenAI and Anthropic. Some researchers reportedly worry that stronger models may be hard to release safely. An OpenAI spokesperson said new safety requirements could slow releases; an Anthropic spokesperson said the company may slow or hold back even at a cost. No public artifact independently verifies details of internal model capabilities.\n- **Why it matters / lens:** Product decisions, investment monitoring and editorial planning. Roadmaps and supplier risk need to account for evaluation, access controls and release timing. Anonymous claims should not be presented as proof that models are out of control.\n- **Publication / type / original source:** November 24, 2026, Axios [exclusive report and company responses](https://www.axios.com/2026/11/24/anthropic-openai-unreleased-ai-safety-risks), media interviews.\n- **Corroboration / confidence:** Multiple anonymous sources and named company responses support that a debate exists. Specific unreleased capabilities and risks have no independent public verification. Medium confidence.\n- **Trend:** T07, continuing rise; safe-release boundaries for more capable models remain unresolved.\n\n### 4. Zipher raises $45 million in a new round, $53 million cumulatively\n\n- **What happened:** Its press release reports $53 million across seed and Series A. An independent Ctech interview identifies the current Series A as $45 million and the 2024 seed as $8 million. The product lets agents choose data-processing engines, capacity and schedules within customer-defined SLAs and budgets.\n- **Why it matters / lens:** Investment monitoring and product decisions. Enterprise agent infrastructure extends from chat into background data jobs. Measure actual workload costs, SLA performance, recovery and human intervention.\n- **Publication / type / original sources:** November 24, 2026, [company press release](https://www.businesswire.com/news/home/20261124091381/en/) and [Ctech independent interview](https://www.calcalistech.com/ctechnews/article/bkreuwq1xg), company announcement and media.\n- **Corroboration / confidence:** Financing definitions can be cross-checked. Company claims of customer savings and SLA improvements lack public independent task data. Medium-high confidence in funding; performance remains unverified.\n- **Trend:** T04/T08, first appearance; agent operations infrastructure attracts capital.\n\n### 5. NVIDIA publishes a Microduck simulation-to-robot obstacle-avoidance workflow\n\n- **What happened:** NVIDIA's Hugging Face tutorial uses Isaac Lab, Newton and a time-of-flight sensor to train a Microduck avoidance controller while retaining its walking policy. It documents ONNX export and real-robot test steps. The parallel-environment count is an example configuration, not a minimum hardware requirement.\n- **Why it matters / lens:** Product decisions and technical context. Separating walking from avoidance helps localize failures and reuse the lower-level policy. Reproducibility, real-robot collisions and generalization beyond training scenes still need independent measurement. This is a robot-control workflow, not a game world model.\n- **Publication / type / original sources:** November 24, 2026, NVIDIA's [Hugging Face tutorial](https://huggingface.co/blog/nvidia/microduck-obstacle-avoidance) and linked code, first-party technical material.\n- **Corroboration / confidence:** Code and steps are inspectable; the article does not provide an independent large-scale real-robot evaluation. High confidence in delivery; effects await replication.\n- **Trend:** T02/T05, continuing rise; embodied workflows move from model demos to simulation and deployment tooling.\n\n### 6. OpenAI describes Astra-assisted searches for exoplanet candidates\n\n- **What happened:** Two amateur researchers used Codex/Astra to write and run search workflows on public telescope data. A SETI researcher independently found two matching signals; another set of candidates went to astronomers for further analysis. None of the signals has been confirmed as a planet.\n- **Why it matters / lens:** Editorial planning, technical context and product decisions. This illustrates agents helping non-specialists set up research workflows. Preserve code, source data, false-positive checks and external-review records; do not call candidates discoveries.\n- **Publication / type / original source:** November 24, 2026, OpenAI [case study](https://openai.com/index/searching-for-distant-planets-with-astra/), first-party participant account.\n- **Corroboration / confidence:** The article quotes a SETI researcher who independently checked two signals. Further observation and peer review are still needed. Confidence in candidates and the check process is reasonable; planet status remains unverified.\n- **Trend:** T04/T07, continuing rise; scientific agent outputs enter external review.\n\n### 7. Marlowe discloses multi-silicon inference infrastructure and funding (catch-up)\n\n- **What happened:** Marlowe disclosed a $277 million seed round on November 23 and proposed co-designing chips, systems and software for inference workloads, citing chip ecosystems including AMD and Etched. An AMD executive said in Marlowe's article that Helios deployment is planned for next year; that is a plan, not delivered capacity.\n- **Why it matters / lens:** Investment monitoring and product decisions. Inference costs and supply chains may diversify across chips, but real workloads must test throughput, per-task cost, software compatibility and available capacity.\n- **Publication / type / original sources:** November 23, 2026, [Marlowe founders' announcement](https://www.marlowe.ai/introducing-marlowe.html), caught up November 25; [DCD report](https://www.datacenterdynamics.com/en/news/ai-cloud-startup-marlowe-secures-277m-in-seed-funding/) published November 24.\n- **Corroboration / confidence:** Press coverage corroborates the funding announcement; cost advantage and next-year deployment remain company and partner plans. Medium-high confidence in funding; operating results remain unverified.\n- **Trend:** T03/T08, first catch-up; inference optimization moves from individual chips to system-level co-design.\n\n## Next checks\n\n- Track independent protein wet-lab tests, HFE's ability to predict real-task failure, and whether the unreleased-model safety debate produces public evaluation artifacts.\n- Calculate complete-task costs for agent data scheduling and multi-silicon inference; record robot collisions and human takeovers across scenes.\n- Continue scanning for actually playable world-model and AI-game releases. This edition does not relabel interactive 3D code demos or robot avoidance as a game world model.\n";

  catch (e) { el.classList.add("mermaid-error"); el.textContent = "Mermaid syntax error: " + e.message; }
}
