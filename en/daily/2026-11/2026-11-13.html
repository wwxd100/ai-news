import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";
const source = "# AI Daily Brief · 2026-11-13\n\n[English (current)](2026-11-13.md) · [中文](../../../daily/2026-11/2026-11-13.md)\n\n- **Collection cutoff:** November 13, 2026, 11:00 Asia/Shanghai. Sources dated only November 12 cannot establish their exact launch hour, so they appear here; see the separate [November 12 catch-up](2026-11-12.md).\n- **Edition:** Six high-signal developments. The Hydrogen model and Search deployment are linked rather than counted as separate foundation models. [Archive](../../INDEX.md) · [Trend tracker](../../../TRACKERS.md).\n\n## Key conclusions\n\n1. **Capable models are being assigned different jobs.** Google launched Gemini 4 Hydrogen and Antigravity Orchestrator to switch dynamically between Carbon and Hydrogen. Product selection needs completed-task quality, routing overhead and full workflow cost; vendor benchmarks do not establish independent production performance.\n2. **Creative software is turning character continuity and shot variants into usable tools.** Flow added five creator-built tools. For interactive content, test continuity across shots, asset rights and rework time.\n3. **Open-weight speech models are reaching self-hosted use cases.** Salesforce released SOV-Transcribe-1 under Apache 2.0 for non-streaming transcription. Named entities, format control and noisy audio are practical acceptance tests.\n4. **Safety and privacy now shape delivery.** Anthropic's Anvil automated red-team results are internal research; Google's Gemini eyewear is open for pre-order with stated privacy features. Both need outside validation.\n\n```mermaid\nflowchart LR\n  A[\"Model tiers and open weights\"] --> D[\"Task quality and full cost\"]\n  B[\"Creation and wearable products\"] --> D\n  C[\"Safety tests and privacy design\"] --> D\n  D --> E[\"Product decisions and editorial planning\"]\n```\n\n## Notable developments\n\n### 1. Google launches Gemini 4 Hydrogen and Antigravity Orchestrator\n\n- **What happened:** Google positions Hydrogen for frequent coding and agent execution, with availability across AI Studio, the Gemini API, enterprise products, the Gemini app and Search. API list prices are $1.50/$7.50 per million input/output tokens, with a one-million-token context. Antigravity Orchestrator can assign work dynamically to Carbon and Hydrogen. Google reports near-Carbon task success on Terminal-Bench 4.0 with 24% less quota and 19% faster completion on average.\n- **Why it matters / lenses:** Product decisions, investment monitoring and technical context. Model routing must be measured by end-to-end success, retries, latency and quota, not only per-call price. Vendor benchmarks and partner comments are not independent production tests.\n- **Published / type / primary source:** November 12, 2026, Google model and product announcement; [official release](https://blog.google/innovation-and-ai/models-and-research/gemini-models/introducing-gemini-4-hydrogen/).\n- **Corroboration / confidence:** Release, interface and list price are official and high confidence. Performance and safety figures are mainly Google-reported and await independent retesting.\n- **Trend:** T01/T04 warming; extends Carbon and lower-cost execution tiers.\n\n### 2. Google Search deploys Hydrogen for complex queries and visual results\n\n- **What happened:** Google says Hydrogen is reaching Search users globally, with multi-part query retrieval, website links, tables, images and custom tools. This is a distribution extension of the same Hydrogen model, not a second foundation-model launch.\n- **Why it matters / lenses:** Product decisions and editorial planning. AI Search may alter content discovery and conversion; test source visibility, click-through, citation accuracy and regional differences.\n- **Published / type / primary source:** November 12, 2026, Google Search announcement; [official release](https://blog.google/products-and-platforms/products/search/gemini-4-hydrogen-search-upgrade/).\n- **Corroboration / confidence:** Google's two posts share a publisher. Feature launch: high confidence; traffic impact lacks independent data.\n- **Trend:** T01/T08 warming; product extension of item 1.\n\n### 3. Google Flow releases five visual-storytelling tools\n\n- **What happened:** Flow added Character Poster, Character Arc, Pixel Machine, Lucid Glass and Pocket Studio for visual style, character changes across ages, retro looks, optical effects and shot variants from one phone video.\n- **Why it matters / lenses:** Product decisions, editorial planning and AI in gaming. Character continuity and shot variants matter to interactive-story asset pipelines. Test editability, cross-scene consistency, rights and rework time. These are creative tools, not a game world model.\n- **Published / type / primary source:** November 12, 2026, Google Labs product announcement; [official release](https://blog.google/innovation-and-ai/models-and-research/google-labs/new-google-flow-tools/).\n- **Corroboration / confidence:** One official source. Tool release: high confidence; time savings and finished quality need independent tests.\n- **Trend:** T03/T05 warming.\n\n### 4. Salesforce releases open-weight SOV-Transcribe-1 speech model\n\n- **What happened:** Salesforce published SOV-Transcribe-1 on Hugging Face, with 4B active/26B total parameters, non-streaming ASR, instruction-guided formatting, keyword hints and multilingual support. Weights carry Apache 2.0. The company cites a first-place ranking among open-weight models on a specified leaderboard.\n- **Why it matters / lenses:** Product decisions and technical context. Voice-agent failures often occur in emails, numbers, names and tool arguments. Retest on actual accents, noise, latency and entity accuracy. Open weights do not imply real-time conversational latency.\n- **Published / type / primary sources:** November 12, 2026, Salesforce team article and model card on Hugging Face; [release](https://huggingface.co/blog/salesforce-sovereign-intelligence/sov-transcribe-1) · [model card](https://huggingface.co/salesforce-sovereign-intelligence/SOV-Transcribe-1).\n- **Corroboration / confidence:** Weights and license can be inspected. A third-party leaderboard is cited selectively by the publisher; application performance needs independent testing.\n- **Trend:** T03/T04 first tracked here.\n\n### 5. Anthropic reports Anvil automated red-team research\n\n- **What happened:** Anthropic's researchers say their internal Anvil system found specified weaknesses in its biological, cyber and anti-distillation safeguard tests faster than contracted human red teams, and is used before releases. It depends on internal frontier models and safeguard details; the paper also distinguishes attacker conditions from real traffic.\n- **Why it matters / lenses:** Product decisions and technical context. Safety testing is moving from static prompts to adaptive agent pressure tests. Check scope, repair loops, false positives, cost and independent review; the internal comparison does not prove every safeguard is secure.\n- **Published / type / primary source:** November 12, 2026, Anthropic safety research; [research article](https://safeguards.anthropic.com/2026/automated-red-teaming/).\n- **Corroboration / confidence:** One research team, with readable methods and limits. Comparative advantage and production protection are not independently reproduced; medium confidence.\n- **Trend:** T07 warming.\n\n### 6. Google opens pre-orders for Gemini intelligent eyewear\n\n- **What happened:** Google announced pre-orders for eyewear designed with Gentle Monster, Warby Parker and Samsung, with sales beginning December 10. It integrates Gemini, navigation and live translation. Google describes restrictions on camera-visual history and training use, bystander face redaction and a recording indicator. Designs and market availability differ.\n- **Why it matters / lenses:** Product decisions, investment monitoring and editorial planning. A multimodal assistant moves into a wearable context where interaction, social acceptance and privacy constraints all matter. Pre-orders do not establish sales or retention.\n- **Published / type / primary source:** November 12, 2026, Google hardware announcement; [official release](https://blog.google/innovation-and-ai/technology/xr-ar/google-intelligent-eyewear-collections-pre-order/).\n- **Corroboration / confidence:** Single vendor announcement. Pre-order status: high confidence; battery life, privacy effectiveness and adoption need outside testing.\n- **Trend:** T03/T08 first tracked here; watch December delivery.\n\n## Tracking and limitations\n\n- **Warming:** Model tiers and routing, character/shot control in creative tools, self-hosted speech and automated safety testing.\n- **To verify:** Hydrogen's full task cost and Search referrals; Flow long-form continuity; SOV-Transcribe-1 entity accuracy; outside replication of Anvil; eyewear delivery and privacy effectiveness.\n- **Coverage limit:** A source dated only November 12 is not assumed to precede yesterday's 11:00 cutoff. US providers dominate this edition, which is not evidence that other regions had no progress. The November 12 catch-up is separate.\n";

  try { await mermaid.run({ nodes: [el] }); }
  catch (e) { el.classList.add("mermaid-error"); el.textContent = "Mermaid syntax error: " + e.message; }
}
