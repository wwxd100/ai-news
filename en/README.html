<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI News</title>
<style>
  :root { color-scheme: light dark; --fg:#1f2328; --bg:#fff; --muted:#656d76; --line:#d0d7de; --code:#f6f8fa; }
  @media (prefers-color-scheme: dark) { :root { --fg:#e6edf3; --bg:#0d1117; --muted:#8d96a0; --line:#30363d; --code:#161b22; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.7 -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif; }
  main { max-width:960px; margin:0 auto; padding:40px 24px 80px; }
  h1,h2,h3 { line-height:1.3; } h1,h2 { border-bottom:1px solid var(--line); padding-bottom:.3em; }
  a { color:#0969da; } blockquote { margin:0; padding:0 1em; color:var(--muted); border-left:4px solid var(--line); }
  code { background:var(--code); padding:.15em .4em; border-radius:6px; font-size:.9em; }
  pre { background:var(--code); padding:16px; border-radius:8px; overflow:auto; } pre code { padding:0; }
  table { border-collapse:collapse; display:block; overflow:auto; }
  th,td { border:1px solid var(--line); padding:6px 12px; }
  .language-switch { max-width:960px; margin:0 auto; padding:16px 24px 0; text-align:right; }
  .language-switch a { margin-left:12px; }
  .language-switch [aria-current="page"] { color:var(--fg); font-weight:600; text-decoration:none; }
  .mermaid { display:flex; justify-content:center; margin:24px 0; padding:16px; border:1px solid var(--line); border-radius:12px; overflow:auto; }
  .mermaid-error { color:#cf222e; white-space:pre-wrap; }
</style>
</head>
<body>
<nav class="language-switch" aria-label="Language / 语言"><a href="../README.html" lang="zh-CN">中文</a><a href="README.html" lang="en" aria-current="page">English</a></nav>
<main id="content"></main>
<script type="module">
import { marked } from "https://cdn.jsdelivr.net/npm/marked@12/lib/marked.esm.js";
import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";
const source = "# AI News\n\n[English (current)](README.md) · [中文](../README.md)\n\nAn evidence-linked AI intelligence archive for product decisions and story ideas, with investment watch and AI literacy as secondary lenses. Coverage includes LLMs, multimodal and world models, AI applications, AI games, companies, research, and important expert perspectives.\n\n## Latest bilingual brief\n\n- [2026-10-18 AI Daily Brief — export registration, DeepSeek 1017, agent memory](daily/2026-10/2026-10-18.md) · [HTML](daily/2026-10/2026-10-18.html) · [中文](../daily/2026-10/2026-10-18.md)\n\nFrom October 18, 2026 onward, new daily briefs are intended to have complete Chinese and English editions, with language links at the top of each. Older briefs remain [available in Chinese](../INDEX.md); they are not labeled as translated until an English edition has actually been reviewed and published. The two versions must share the same underlying events, primary links, dates, confidence labels, and separation of facts from claims and opinions.\n\n## Current decision signals\n\n1. **Separate announced controls from effective requirements.** China's proposed technology-export catalog remains a draft, but specified pre-export registration took effect when the October 16 notice was published. Licensing technology abroad and serving an API abroad are not the same transaction.\n2. **Judge agent infrastructure by complete tasks.** DeepSeek V4.1 Flash 1017 weights and Search/Fetch APIs are available; vendor benchmark gains and search-scale claims need independent tests, and retrieval adds its own cost and risk.\n3. **Treat memory writing as a state-management problem.** Tencent's specialized memory writer and the AtMem failure retrospective use different methods; both motivate tests of missed writes, false writes, updates, latency, and long-run recovery.\n4. **Do not conflate generated game projects with interactive world models.** DeepSeek's game-development examples are not evidence of persistent, real-time simulated worlds. Long-session player tests remain essential.\n\n```mermaid\nflowchart LR\n  A[\"Primary releases\"] --> B[\"Verified availability and scope\"]\n  B --> C[\"Independent task tests\"]\n  C --> D[\"Product and editorial decisions\"]\n  E[\"Counterevidence and gaps\"] --> C\n```\n\n[English archive index](INDEX.md) · [Chinese methodology](../METHODOLOGY.md) · [Chinese trend tracker](../TRACKERS.md)\n\n> Research information only; not investment, medical, or legal advice. Check primary sources before consequential decisions.\n";
const root = document.getElementById("content");
root.innerHTML = marked.parse(source);
root.querySelectorAll("pre > code.language-mermaid").forEach((code) => {
  const div = document.createElement("div");
  div.className = "mermaid";
  div.textContent = code.textContent;
  code.parentElement.replaceWith(div);
});
const dark = matchMedia("(prefers-color-scheme: dark)").matches;
mermaid.initialize({ startOnLoad: false, theme: dark ? "dark" : "default", securityLevel: "strict" });
for (const el of root.querySelectorAll(".mermaid")) {
  try { await mermaid.run({ nodes: [el] }); }
  catch (e) { el.classList.add("mermaid-error"); el.textContent = "Mermaid syntax error: " + e.message; }
}
document.body.dataset.rendered = "true";
</script>
</body>
</html>
