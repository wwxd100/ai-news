const source = "# AI 日报 · 2026-10-18\n\n[中文（当前）](2026-10-18.md) · [English](../../en/daily/2026-10/2026-10-18.md)\n\n- **采集截止：** 2026-10-18 11:01（Asia/Shanghai），按自动任务触发时刻。只标日期的 10 月 17 日材料无法证明精确入窗时间，若实际晚于截止则下一期校正。\n- **本期性质：** 周末高信号短版，5 条；不以转载、过时论文或未经核实的帖子填充通常 20–30 条。已与 [10 月 17 日日报](2026-10-17.md)排重。\n- **导航：** [趋势追踪](../../TRACKERS.md) · [历史索引](../../INDEX.md)。W42 尚未结束，不提前生成周报。\n\n## 今日关键结论\n\n1. **中国 AI 技术出海出现真实的即时合规动作，但不是“23 项技术已正式禁运”。** 商务部、科技部 10 月 16 日 16:00 发布 40 项技术目录修订征求意见，其中 23 项涉及 AI；目录仍是草案，但附件所列技术的特定出口情形从公告日起须先登记。产品层要把模型权重/技术授权、海外部署和境外 API/SaaS 调用分别梳理，具体交易交专业法务判断。\n2. **DeepSeek 同日推进“模型 + Agent 搜索基础设施”。** V4.1 Flash 1017 权重和 MIT 许可可核；网站、App、API 已切换的说法来自官方。厂商基准改善不是独立任务复测。Search/Fetch 接口公开，每个接口标价 5 元/千次，服务端工具调用免费期到北京时间 11 月 1 日 00:00；需把模型 token、搜索与抓取的总成本一起算。\n3. **Agent 长期记忆正从“能检索”转向“写得对、更新得对”。** 腾讯开放专门负责记忆写入的 Hy-Memory-30B-A3B 权重及框架；同日一项小型社区复盘却表明，记忆分类器离线分数改善可在真实回放中退化。两者不是同一基准，不能互判胜负，但共同提示要评估错误写入、漏写、延迟和连续状态后果。\n4. **AI 游戏/世界模型今日无新的可核商用跃迁。** DeepSeek 展示网页赛车和 Godot 游戏开发样例，属于代码 Agent 做项目，不是实时生成、持续状态一致的可玩世界模型；继续以 Matrix-Game 4.0 的长时体验、延迟、成本为验证点。\n\n```mermaid\nflowchart LR\n  A[\"新权重与搜索接口\"] --> D[\"真实任务质量/总成本\"]\n  B[\"记忆写入模型与失败复盘\"] --> E[\"连续状态验收\"]\n  C[\"技术出口草案与即时登记\"] --> F[\"出海路径合规核对\"]\n  D --> G[\"产品决策\"]\n  E --> G\n  F --> G\n```\n\n## 重点动态\n\n### 1. 中国发布技术出口目录征求意见，并启动临时出口前登记\n\n- **发生了什么：** 商务部、科技部第 48 号公告拟将 AI、生物医药、光伏共 40 项技术增列目录，其中 AI 23 项；征求意见截至 11 月 15 日。目录修订尚未正式实施，但对公告附件所列技术，在技术所有权向境外转让、境内技术授权境外使用、实际控制人变更为境外主体等情形，出口前登记要求从 10 月 16 日公告发布日起生效。公开领域技术排除在该范围外。\n- **为什么重要 / 视角：** 产品决策/投资观察：中国产模型的开源、海外本地部署、技术许可、境外云与 API 出海的合规路径需要分别核查。商务部答问称正式实施后，限制类大模型的海外本地部署属技术出口范围，API、App、SaaS 等提供调用通常不属大模型技术出口范围；这不能替代对具体交易的法律判断。\n- **发布时间 / 类型 / 原始信源：** 2026-10-16 16:00 北京时间，政府公告与官方答问；[第 48 号公告](https://www.mofcom.gov.cn/zcfb/blgg/art/2026/art_1666fcaa24424766afe0683498ff0908.html) · [商务部答问](https://www.mofcom.gov.cn/syxwfb/art/2026/art_a4acff07e134447fbe7bbeb486df3ea6.html)。\n- **交叉验证 / 可信度：** 公告和答问属同一政府体系；[AP 独立报道](https://apnews.com/article/5ac381c0c6d6628bbea2e0da7d855a5b)确认公布草案，但具体义务以原文为准。高（发布、数字、临时登记），待确定（最终目录与逐项适用）。\n- **趋势：** T06/T07 首次出现的政策变量；“提案”与“即时登记”分层追踪。\n\n### 2. DeepSeek V4.1 Flash 1017 发布权重并切换服务版本\n\n- **发生了什么：** DeepSeek 发布 V4.1 Flash 的 1017 小版本，Hugging Face 权重以 MIT 许可公开，模型卡标称 1M 上下文；官方称网页、App、API 已同步切换。模型卡自报 DeepSWE v1.1 从 74.2 到 77.0、Terminal-Bench 4.0 从 31.2 到 42.3，但基准、Harness 与竞品比较均未在本期独立复跑。\n- **为什么重要 / 视角：** 产品决策/内容选题/AI 游戏：值得用固定的编程、工具调用、多模态理解及游戏制作任务比较结果质量和总成本。官方给出的网页赛车、Godot 游戏样例是项目生成展示，不代表游戏世界模型有长时实时交互能力。\n- **发布时间 / 类型 / 原始信源：** 官方公告标注 2026-10-17，未给精确时分；[DeepSeek 中文公告](https://api-docs.deepseek.com/zh-cn/news/news261017/) · [Hugging Face 模型卡与权重](https://huggingface.co/deepseek-ai/DeepSeek-V4.1-Flash-1017)。\n- **交叉验证 / 可信度：** 官方公告与权重库可核对交付，仍属同一发布方，不能算独立性能验证。高（权重和许可），中（服务切换声明），待验证（性能、任务成本、1M 有效性）。\n- **趋势：** T01/T06 持续升温；T05 仅属游戏开发工具增量，非可玩世界模型突破。\n\n### 3. DeepSeek 面向开发者公开 Search 与 Fetch API\n\n- **发生了什么：** DeepSeek 公开搜索和网页抓取两个接口，分别返回结构化搜索结果、网页 Markdown 内容；每个接口标价 5 元/千次成功调用。官方称 DeepSeek API 用户通过 DeepSeek Harness、Claude Code、Codex 等服务端工具产生的 Search/Fetch 调用在北京时间 11 月 1 日 00:00 前暂免该接口费用，之后按次收费；模型 token 费用另计。\n- **为什么重要 / 视角：** 产品决策/投资观察：Agent 的网络证据获取成为可单独计价的基础设施；要同时测搜索召回、抓取可得性、来源可信度、注入防护、单任务总调用次数和成本。官方宣称的索引规模与日请求量未获独立审计。\n- **发布时间 / 类型 / 原始信源：** 2026-10-17（公告未列时分），官方产品/API 文档；[发布公告](https://api-docs.deepseek.com/zh-cn/news/news261017/) · [Search & Fetch 指南](https://api-docs.deepseek.com/zh-cn/guides/search/)。\n- **交叉验证 / 可信度：** 公告、接口文档和价格页为同一厂商的相互核对，不是独立可用性测试。高（接口定义、公开价格），待验证（搜索质量、日请求量与实际费用）。\n- **趋势：** T01 首次出现的工具层增量；11 月 1 日后复核计费与使用价值。\n\n### 4. 腾讯开放记忆写入专用模型 Hy-Memory-30B-A3B\n\n- **发生了什么：** 腾讯混元模型卡提供 Apache-2.0 权重，模型总参数 30B、约 3B 激活，用于在 Mem0、MemOS、Hy-Memory 等外部记忆框架中决定保留、改写及冲突处理；论文 10 月 15 日提交，仓库的 Hy Memory 2.0.2/2.0.3 发布记录为 10 月 17 日。作者报告在自定义四套 Harness 平均分 55.49%，略高于所测 Claude Opus 5 的 54.62%，仍是团队设定的基准。\n- **为什么重要 / 视角：** 产品决策/知识扫盲：长期 Agent 记忆的写入策略可能值得用独立模型，但须比较高价值信息漏写、误写、冲突更新、删除追溯和完整运行成本，而非仅以作者平均分替代产品验收。\n- **发布时间 / 类型 / 原始信源：** 论文 2026-10-15 16:46 UTC；框架更新 2026-10-17；模型权重发布日期仅能确认本期已可取，精确首次上线时间未核。官方模型卡/预印本/代码；[Hugging Face 权重](https://huggingface.co/tencent/Hy-Memory-30B-A3B) · [论文](https://arxiv.org/abs/2610.22196) · [版本记录](https://github.com/Tencent-Hunyuan/Hy-Memory/blob/main/CHANGELOG.md)。\n- **交叉验证 / 可信度：** 权重、代码及论文可核但均出自同一团队，缺外部任务复测。高（交付与许可证），中低（跨框架得分优势的可迁移性）。\n- **趋势：** T01/T08 记忆由检索组件转为状态写入治理，首次纳入追踪；论文不是 10 月 17 日新发。\n\n### 5. 社区复盘：离线记忆分类器成绩上升，真实回放却退化\n\n- **发生了什么：** AtMem 开发者公开未上线的记忆分类器试验：封存测试集“完全正确”比例由 18.4% 升至 73.8%，但恒定拒绝写入策略在同集可得 91.1%；100 条匹配回放中，确定性规则正确 30 条、两版模型各 16 条，模型运行更慢且没有正确处理要求写入/更新/去重的关键例子。作者因此保留确定性同步写入，并建议学习模型先用于离线或旁路评估。\n- **为什么重要 / 视角：** 产品决策/内容选题：类别极不平衡和连续状态反馈会让总体准确率误导；应单列必须保存信息的召回、错误状态传播、延迟与回滚。它是单个项目的小样本反证，不足以否定所有学习式记忆，也不能直接反驳腾讯不同设定的模型。\n- **发布时间 / 类型 / 原始信源：** 2026-10-17（无精确时分），Hugging Face 社区开发复盘；[原文与复现入口](https://huggingface.co/blog/javadtaghia/we-fine-tuned-a-memory-classifier-for-our-agent-he)。\n- **交叉验证 / 可信度：** 作者提供数据、检查点和回放入口，本期未独立复跑；高（复盘公开），中低（结果外推到其他产品）。\n- **趋势：** T01/T08 对“离线榜分即上线价值”的新反证；待独立复现。\n\n## 连续观察与覆盖缺口\n\n- **较昨日报的变化：** T06 开放模型从 Beam/Ling 延伸到 DeepSeek 1017 与出口政策；T01 新增搜索/抓取工具层与记忆写入专用模型；T05 无新的可玩世界模型实证，DeepSeek 游戏样例不可等同 Matrix-Game 路线。\n- **下一轮要证伪：** DeepSeek 真实编程/游戏制作质量及完整任务成本；搜索接口的来源质量和注入风险；Hy-Memory 对高价值记忆的召回与跨日状态一致性；中国目录附件的具体适用阈值、11 月 15 日征求意见后版本和登记实践；Matrix-Game 长时玩家测试。\n- **采集限制：** 已扫官方、模型库、论文、社区及中英文媒体/基金线索；本期未核到可与上述事件同等级的新世界模型、AI 游戏商用首发或基金原始报告。KOL 未有足够新证据，故不强行设置观点栏目。社区复盘非普遍规律，厂商基准非独立验证。有关监管内容仅作信息摘要，不构成法律意见。\n";
const root = document.getElementById("content");
root.innerHTML = marked.parse(source);
root.querySelectorAll("pre > code.language-mermaid").forEach((code) => {
  const div = document.createElement("div");
  div.className = "mermaid";

  code.parentElement.replaceWith(div);

const dark = matchMedia("(prefers-color-scheme: dark)").matches;
mermaid.initialize({ startOnLoad: false, theme: dark ? "dark" : "default", securityLevel: "strict" });
for (const el of root.querySelectorAll(".mermaid")) {
  try { await mermaid.run({ nodes: [el] }); }
  catch (e) { el.classList.add("mermaid-error"); el.textContent = "Mermaid \u8bed\u6cd5\u9519\u8bef\uff1a" + e.message; }
}
document.body.dataset.rendered = "true";
</script>
