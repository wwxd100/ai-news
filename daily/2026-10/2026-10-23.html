const source = "# AI 日报 · 2026-10-23\n\n[中文（当前）](2026-10-23.md) · [English](../../en/daily/2026-10/2026-10-23.md)\n\n- **采集截止：** 2026-10-23 10:30（Asia/Shanghai）。主要核查 10 月 22 日 10:30 后的新披露，与[昨日](2026-10-22.md)排重；只标日期的来源无法确认具体上线时刻。\n- **本期性质：** 10 条高信号动态，含两项注明原始日期的补漏。中国公司高管观点与产品交付、海外厂商基准与独立复测分别处理；未为 20–30 条目标加入未经核实的传言。\n- **导航：** [趋势追踪](../../TRACKERS.md) · [历史索引](../../INDEX.md)。\n\n## 今日关键结论\n\n1. **“答对一次”与“稳定完成”成为 Agent 两套指标。** OpenAI Decisions API 从公测转 GA；微软与 Hugging Face 的 ThinkingBox 训练报告把数据库最终状态用作强化学习奖励，重复 20 次全成功的任务数从 38 增至 107，但至少成功一次的任务数下降。生产验收必须同时看延迟、平均成功率、重复可靠性和越权行为。\n2. **多模态基础设施在检索和空间数据两端继续细化。** NVIDIA 发布 Nemotron 3.5 文档检索/解析权重，Ai2 发布 OlmoEarth v1.3 及全球预计算卫星嵌入；厂商榜分不能直接外推到自有中文素材或地理任务。\n3. **补漏修正世界模型覆盖。** 10 月 20 日已发布的 Cosmos3-H-Dreams 有手术机器人动作条件视频生成权重与代码，前两期未收录；它是科研模拟器，不是可玩 AI 游戏，也未经临床或生物力学验证。\n4. **企业 Agent 的“部署”不等于成效证明。** Uber 称向 3 万多员工推出 ChatGPT Work，澳大利亚中小企业报告估算大规模采用 AI 的潜在经济价值；前者尚无公布的实际生产率数据，后者是情景预测，不是已实现收入。\n5. **物理 AI 的乐观时间表仍是观点。** 宇树王兴兴预计未来 1–3 年可能出现突破，认为商业服务比家庭/工业更早落地；他的依据和产业位置值得跟踪，但没有独立长时任务数据支持确定拐点。\n\n```mermaid\nflowchart LR\n  A[\"模型与工具可用\"] --> D[\"真实任务\"]\n  B[\"重复可靠性及权限\"] --> D\n  C[\"数据、部署与成本\"] --> D\n  D --> E[\"独立复测与商业结果\"]\n```\n\n## 重点动态\n\n### 1. OpenAI Decisions API 从公测转为正式可用\n\n- **发生了什么：** Decisions API 基于 GPT-6 Luna，为文字、图片及 JSON 输入返回概率、预设选项或分数，支持每次请求最多 400 个问题，并新增与 GPT-Live 的原生集成、提示缓存和美欧推理驻留。OpenAI 称相对通过 Responses API 调 Luna 最快可达 10 倍；Box、Datadog 等数字是各自场景的客户测量。\n- **为什么重要 / 视角：** 产品决策、内容选题。Agent 的小型路由/风险判定可从主模型调用中拆出；仍需同任务测试误判、尾延迟和失败代价，而不只看单次速度。\n- **发布时间 / 类型 / 原始信源：** 2026-10-22，产品公告；[OpenAI](https://openai.com/index/decisions-api/)。\n- **交叉验证 / 可信度：** 官方公告可确认 GA 与功能；性能和客户收益未获独立同负载复测。高（发布状态）；待验证（速度与业务效果）。\n- **趋势：** T01/T04 已落地；此前有限预览推进到 GA。\n\n### 2. ThinkingBox 把数据库最终状态评分用于 Agent 强化学习\n\n- **发生了什么：** 微软与 Hugging Face 联合文章公开 ThinkingBox-Training 代码，以训练任务的真实数据库最终状态给奖励。报告称 Qwen3.8-27B 经 50 步 GRPO 后，在 507 个未用于训练的任务上，平均成功率从 51.70% 至 60.78%，20 次尝试全部成功的任务数从 38 至 107；但至少成功一次的任务数从 453 降至 446。\n- **为什么重要 / 视角：** 产品决策、技术背景。结果状态而非“Agent 自称完成”更接近业务验收；重复可靠性改善可能伴随覆盖面损失，须针对真实权限和异常路径做复测。\n- **发布时间 / 类型 / 原始信源：** 2026-10-22，联合技术报告与代码；[微软/Hugging Face 原文](https://huggingface.co/blog/microsoft/thinkingbox-training)。\n- **交叉验证 / 可信度：** 代码与实验设置公开可检查，但指标为研究团队报告，尚无外部复现。高（公开方法）；待验证（榜分与迁移）。\n- **趋势：** T01 持续升温；从单次 pass@1 转向重复成功和最终状态。\n\n### 3. NVIDIA Nemotron 3.5 发布文档嵌入、重排与解析模型权重\n\n- **发生了什么：** NVIDIA 在 Hugging Face 提供 Nemotron 3.5 Embed 8B/1B、Rerank 8B 和 Parse 631M 的模型页，覆盖图文检索、候选重排和文档结构提取，并提供不同精度版本。文章引用 ViDoRe v3.1、ParseBench 与客户测试；这些成绩的样本、硬件和比较对象有条件限制。\n- **为什么重要 / 视角：** 产品决策、技术背景。Agent 的证据检索质量可能比继续扩大主模型更影响完成成本；应在中文混排资料上比较召回、引用正确率、延迟及许可。\n- **发布时间 / 类型 / 原始信源：** 2026-10-21（本期补漏），公司社区技术文章与模型卡；[NVIDIA/Hugging Face 说明](https://huggingface.co/blog/nvidia/nemotron-retriever-world-class-agentic-retrieval) · [Embed 8B 模型卡](https://huggingface.co/nvidia/Nemotron-3.5-Embed-8B-BF16)。\n- **交叉验证 / 可信度：** 权重和卡片可核；厂商榜分及合作客户口径非独立实测。高（资产可获取）；待验证（目标语料表现）。\n- **趋势：** T03/T06 持续升温；多模态检索层专业化。\n\n### 4. Cosmos3-H-Dreams 手术机器人世界模型已于 10 月 20 日发布\n\n- **发生了什么：** NVIDIA 发布动作条件手术视频生成模型 Cosmos3-H-Dreams 的权重、代码和研究演示。模型接收内窥镜画面及双臂动作，生成后续画面；针对胆囊切除场景，提供 4 步和 2 步去噪学生模型。官方称单张 RTX PRO 6000 可实时交互；模型卡确认 10 月 20 日发布，前两期漏收录。\n- **为什么重要 / 视角：** 产品决策、技术背景、内容选题。它是环境动态建模的实例，不是游戏开发工具或可玩世界；外观逼真不等于组织力学真实，也不是临床认证产品。\n- **发布时间 / 类型 / 原始信源：** 2026-10-20（事后补漏），NVIDIA 技术说明、代码与模型卡；[技术说明](https://huggingface.co/blog/nvidia/cosmos3-h-dreams) · [模型卡](https://huggingface.co/nvidia/Cosmos3-H-Dreams)。\n- **交叉验证 / 可信度：** 代码/权重/发布日期可核，实时性能与物理准确性缺独立复测；NVIDIA 明确不用于患者照护。高（发布与领域边界）；待验证（长时一致性和生物力学）。\n- **趋势：** T02 补漏并修正采集记录；世界模型向专业仿真分化，AI 游戏仍无同等级新交付。\n\n### 5. IBM Granite Speech 5.0 发布新语音模型及两个更新版\n\n- **发生了什么：** IBM Granite 团队发布 Granite Speech 5.0 2B，并更新 470M Turbo CTC 与 Granite Speech 4.1 2B Plus；分别面向多语言转写/翻译、低延迟转写和说话人归属。2B 模型卡可见，Apache 2.0 许可；文章的速度/错误率来自团队对特定测试集测量。\n- **为什么重要 / 视角：** 产品决策、技术背景。语音工作流需分别验收中英混说、噪声、专有名词、说话人时间戳和设备成本，不能由英语短句 WER 推断全部语言体验。\n- **发布时间 / 类型 / 原始信源：** 2026-10-21（本期补漏），IBM 社区发布与模型卡；[Granite 团队文章](https://huggingface.co/blog/ibm-granite/granite-speech-5) · [2B 模型卡](https://huggingface.co/ibm-granite/granite-speech-5.0-2b)。\n- **交叉验证 / 可信度：** 权重/许可可核；性能缺目标场景独立实测。高（交付）；待验证（多语、噪声与端侧表现）。\n- **趋势：** T03/T04 增加语音生产选项；不与通用对话模型混写。\n\n### 6. Uber 宣布把 ChatGPT Work 扩至逾 3 万员工\n\n- **发生了什么：** Uber/OpenAI 公告称，在 1000 人试点后，将 ChatGPT Work 推向全球逾 3 万员工，可连接 Drive、Gmail、Calendar、Slack，并由内部 Skills 库与培训支持。公告没有公布试点完成率、节省工时或企业整体 ROI。\n- **为什么重要 / 视角：** 产品决策、投资观察。企业 Agent 扩张阶段需看权限、内部知识资产、培训和审计；席位覆盖不等于日活或效率收益。\n- **发布时间 / 类型 / 原始信源：** 2026-10-22，合作公告；[OpenAI/Uber 公告](https://openai.com/index/uber-chatgpt-work-rollout/)。\n- **交叉验证 / 可信度：** 双方同一商业合作材料；实际采用与效果待公布。高（扩张计划）；待验证（使用及 ROI）。\n- **趋势：** T01/T08 持续升温；大企业从试点走向全员准入。\n\n### 7. 澳大利亚中小企业 AI 报告估算潜在年经济价值 930 亿澳元\n\n- **发生了什么：** 澳大利亚科技理事会与 Google 等伙伴发布报告，估算未来五年扩大中小企业 AI 应用可带来最高 930 亿澳元额外年经济价值，单家广泛采用的潜在年生产率价值约 13.6 万澳元。这是模型估算，不是已实现产出；Google 也是资助/合作方。\n- **为什么重要 / 视角：** 投资观察、知识扫盲、产品决策。采用率与潜在价值差距提示培训、流程重构和测量机会，但不能把宏观潜力当成产品定价或市场规模证据。\n- **发布时间 / 类型 / 原始信源：** 2026-10-22，行业研究报告；[科技理事会研究页及报告下载](https://techcouncil.com.au/research/) · [Google 摘要](https://blog.google/intl/en-au/company-news/ai-could-add-93-billion-to-australian-small-businesses/)。\n- **交叉验证 / 可信度：** 可核报告存在与估算口径；伙伴摘要不是独立验证，本轮未复核完整 18MB 报告方法。高（发布）；中/待验证（经济估算）。\n- **趋势：** T08 持续升温；下一步看纵向实测与净收益。\n\n### 8. 宇树王兴兴预计物理 AI 拐点或在 1–3 年，属高管判断\n\n- **发生了什么：** 宇树创始人王兴兴在 10 月 22 日杭州会议称，物理 AI 可能在未来约 1–3 年突破，核心难点是模型输入输出与实体机器人对齐，并认为商业服务可能先于家庭和工业场景落地。报道为对其讲话的转述，不是公司发布的通用机器人模型。\n- **为什么重要 / 视角：** 产品决策、投资观察、内容选题。可跟踪受控环境任务、硬件规模化与服务单位经济；反方是长时可靠性、复杂环境泛化、安全认证和维护成本尚无相应独立证据。\n- **发布时间 / 类型 / 原始信源：** 2026-10-22，高管观点/会议报道；[澎湃现场报道](https://www.thepaper.cn/newsDetail_forward_34306053) · [21 世纪经济报道](https://m.21jingji.com/article/20261022/herald/4e992c2e926a4dcb1c1cca152ef1b0ad_zaker.html)。\n- **交叉验证 / 可信度：** 两家媒体对讲话与日期相互印证；时间预测仍是利益相关方观点，未获独立技术实测支持。高（讲话发生）；待验证（拐点及场景先后）。\n- **趋势：** T02/T06 观点升温，不作为能力已落地证据。\n\n### 9. Ai2 发布 OlmoEarth v1.3 与全球卫星嵌入数据\n\n- **发生了什么：** Ai2 发布 OlmoEarth v1.3 模型、代码、数据与全球年度预计算嵌入，覆盖 10 米像素的卫星时序，并提供浏览器探索工具。团队称 128 维版本在 27 项评测中领先 20 项；榜分是发布团队的比较，不能直接当独立应用效果。\n- **为什么重要 / 视角：** 产品决策、知识扫盲。预计算特征可降低地理变化监测、小地块作物和灾害分析的建模门槛；需关注区域偏差、时效、地面真值与再训练成本。\n- **发布时间 / 类型 / 原始信源：** 2026-10-22，研究发布与模型卡；[Ai2/Hugging Face 文章](https://huggingface.co/blog/allenai/olmoearth-v1-3) · [模型卡](https://huggingface.co/allenai/OlmoEarth-v1_3-Base)。\n- **交叉验证 / 可信度：** 资产可核，公开榜分未在本轮独立复现。高（发布）；待验证（区域与任务收益）。\n- **趋势：** T03 扩展多模态基础设施；这是地球观测嵌入模型，不是可玩世界模型。\n\n### 10. Google 与 Voltus 宣布扩容 1 GW 虚拟电厂安排\n\n- **发生了什么：** Google 称与 Voltus 扩大协议，计划在美国 PJM 电网覆盖区聚合家庭及企业可调负荷，目标从此前 100 MW 扩至 1 GW。公告是建设/采购安排，没有披露已实现 1 GW 可调度能力或数据中心净减排量。\n- **为什么重要 / 视角：** 投资观察、知识扫盲。AI 基础设施的供电约束促使云厂商寻找分布式灵活性；需核对实际签约容量、峰时交付、计量和电网激励，不能把目标容量算作已交付算力。\n- **发布时间 / 类型 / 原始信源：** 2026-10-22，企业公告；[Google 原文](https://blog.google/innovation-and-ai/infrastructure-and-cloud/global-network/virtual-power-plant-1-gigawatt/)。\n- **交叉验证 / 可信度：** 单方公告，未见电网或 Voltus 的独立履约数据。高（协议公告）；待验证（部署与效果）。\n- **趋势：** T06 持续升温；算力建设依赖电力与调度而非只有芯片。\n\n## 连续追踪与覆盖缺口\n\n- **首次/已落地：** Decisions API GA；ThinkingBox 训练代码、Nemotron 检索权重、Granite Speech 权重及 OlmoEarth 数据可获得。各自任务效果仍需复测。\n- **补漏/修正：** Cosmos3-H-Dreams 于 10 月 20 日交付，前两期未收录；修正的是采集完整性，不把它误写成 10 月 22 日新模型或 AI 游戏商用突破。\n- **待验证/反方：** Uber 全员覆盖与真实使用、澳大利亚经济潜力、宇树的时间预测、Google 虚拟电厂交付均缺后续结果。世界模型的视觉连贯性不等于物理准确性；本期仍未核到新的可玩 AI 游戏世界模型成果。\n\n> 本仓库提供研究资讯，不构成投资、医疗、法律或临床建议。重要决策请复核原始信源和适用条件。\n";
const root = document.getElementById("content");
root.innerHTML = marked.parse(source);
root.querySelectorAll("pre > code.language-mermaid").forEach((code) => {
  const div = document.createElement("div");
  div.className = "mermaid";
  div.textContent = code.textContent;
  code.parentElement.replaceWith(div);
});
const dark = matchMedia("(prefers-color-scheme: dark)").matches;
mermaid.initialize({ startOnLoad: false, theme: dark ? "dark" : "default", securityLevel: "strict" });
for (const el of root.querySelectorAll(".mermaid")) {
  try { await mermaid.run({ nodes: [el] }); }
  catch (e) { el.classList.add("mermaid-error"); el.textContent = "Mermaid \u8bed\u6cd5\u9519\u8bef\uff1a" + e.message; }
}
document.body.dataset.rendered = "true";
</script>
