const source = "# AI 日报 · 2026-10-19\n\n[中文（当前）](2026-10-19.md) · [English](../../en/daily/2026-10/2026-10-19.md)\n\n- **采集截止：** 2026-10-19 11:00（Asia/Shanghai）；主要检查 10 月 18 日 11:00 后至截止时出现的新披露，并与[昨日](2026-10-18.md)排重。\n- **本期性质：** 周末后的高信号短版，3 条。模型、世界模型及 AI 游戏未核到足以单列的新发布，不用旧闻填充通常的 20–30 条。\n- **导航：** [趋势追踪](../../TRACKERS.md) · [历史索引](../../INDEX.md)。\n\n## 今日关键结论\n\n1. **Anthropic 将“公共利益”从公司宣言推进到拟议股权安排，但不是已完成的捐赠。** 公司称拟将 5% 股份置入全资公益基金，仍需股东批准；估值每上升 50% 时再追加 2% 属董事会可酌定事项。治理、估值基线与实际拨款尚未披露。\n2. **Character.AI/Disney 案进一步显露“人才与 IP 转移”与“原平台存续”分离。** 新披露的破产文件显示 Disney 同意向至少 60 名员工提供工作机会；此前 2000 万美元安排仅涉及部分 IP 的非独占许可，仍是待法院程序确定的基准竞标，不应写成 Disney 已收购整个产品。\n3. **AI 基础设施的电力接入已成为订单兑现风险。** 多家媒体报道 Microsoft 退出 Nscale 英国 Essex 项目的租用安排；Nscale 承认当地电网问题，并称其他 Microsoft 合同不受影响。项目终止、微软退出 Nscale 全部合作、或推迟至某个确定年份都不是已核实结论。\n\n```mermaid\nflowchart LR\n  A[\"公司治理承诺\"] --> D[\"批准与执行证据\"]\n  B[\"AI 娱乐资产重整\"] --> E[\"人才/IP 与平台存续分离\"]\n  C[\"算力数据中心订单\"] --> F[\"供电与交付核验\"]\n  D --> G[\"产品与投资判断\"]\n  E --> G\n  F --> G\n```\n\n## 重点动态\n\n### 1. Anthropic 宣布拟设股权支持的 Public Benefit Fund\n\n- **发生了什么：** Anthropic 10 月 18 日宣布拟向全资 LLC 形式的公益基金配置公司 5% 股份，须经股东批准；公司估值相对未公开基线上升每 50%，董事会可酌情再增加 2%。公司称约 20% 股份将用于公共利益，但该数字合并创始人个人捐赠承诺、员工配捐及本次拟议安排，不能当作基金已获得 20% 股份。\n- **为什么重要 / 视角：** 投资观察/内容选题：前沿实验室开始尝试将 AI 劳动力影响与公共利益支出绑定长期股权价值。判断实际力度需等待股东批准、基金治理、估值门槛及拨款披露；全资 LLC 的独立性不能预设。\n- **发布时间 / 类型 / 原始信源：** 2026-10-18（官方未标时分），公司公告；[Anthropic 原文](https://www.anthropic.com/news/public-benefit-fund)。\n- **交叉验证 / 可信度：** [AP 独立报道](https://apnews.com/article/8181332fbbc48f2ef9447cef096f14de)确认公告内容，但股权落地仍取决于批准。高（宣布拟议方案），待验证（批准、治理与实际支出）。\n- **趋势：** 首次出现的 AI 公司治理/分配机制信号；与 10 月 17 日记录的 Anthropic 员工结构报告相关，但不据此推断劳动市场因果或补偿效果。\n\n### 2. Disney 对 Character.AI 员工的安排在破产文件中进一步明确\n\n- **发生了什么：** 10 月 18 日媒体报道破产文件显示 Disney 同意向至少 60 名 Character.AI 员工提供工作机会，估计每年薪酬约 6000 万美元，多数收到邀约的人已接受。该披露细化了此前 Disney 的基准竞标和过渡服务安排；交易仍可能出现更优竞标，原平台未来并未因此确定。\n- **为什么重要 / 视角：** 产品决策/AI 游戏/投资观察：角色陪伴与互动娱乐的用户需求、IP/团队价值，可能与独立平台的现金流和安全负债脱钩。不要把人才迁移解读为 Character.AI 用户内容、订阅或服务已由 Disney 全面承接。\n- **发布时间 / 类型 / 原始信源：** 2026-10-18 09:30 PDT（10 月 19 日 00:30 北京时间），媒体依据法院文件报道；[法院文件入口](https://cases.stretto.com/public/x936/14939/PLEADINGS/1493910132680000000114.pdf) · [TechCrunch 报道](https://techcrunch.com/2026/10/18/disney-agrees-to-hire-the-majority-of-character-ais-workforce/) · [Character.AI 早前公告](https://blog.character.ai/an-update-on-character-ai/)。\n- **交叉验证 / 可信度：** 法院文件链接已定位，但本轮访问受限，员工与薪酬数字以媒体对文件的转述为准；公司早前公告仅支持破产与 2000 万美元部分 IP 许可。中（员工与薪酬细节），高（早前破产程序），待验证（法院批准、用户平台结局）。\n- **趋势：** 10 月 14 日重大补漏的持续跟踪；新增人才安排细节，不重复计算破产本身为新事件。\n\n### 3. Microsoft 据报退出 Nscale 英国 Essex 数据中心安排\n\n- **发生了什么：** Guardian 和 Reuters 对 Telegraph 最初报道的跟进显示，Microsoft 不再作为 Nscale 位于 Loughton、Essex 数据中心的计划客户。Guardian 引述 Nscale 表示仍致力于该项目，正寻找替代供电方案，且其他 Microsoft 合同不受影响；电网接入已被指需等到 2030 年代初至中期，但这不是项目最终投产日期。\n- **为什么重要 / 视角：** 投资观察/产品决策：AI 算力合同需同时核对锚定客户、并网时间、可交付电力与融资条件；宣布的 GPU 容量并不等于按期可用算力。对使用这些云资源的产品，交付风险会传导至价格和可用性。\n- **发布时间 / 类型 / 原始信源：** 2026-10-18 08:28 EDT 首发（20:28 北京时间），媒体报道；[Guardian 采访与 Nscale 回应](https://www.theguardian.com/uk-news/2026/oct/18/microsoft-drops-huge-ai-datacentre-project-in-essex-over-power-supply-concerns) · [Reuters 报道](https://www.investing.com/news/stock-market-news/microsoft-pulls-out-of-uk-data-center-deal-with-nscale-telegraph-reports-4955864) · [Nscale 原合作公告](https://www.nscale.com/press-releases/nscale-uk-ai-infrastructure-announcement)。\n- **交叉验证 / 可信度：** Reuters 亦报道撤出但称当时未获 Microsoft/Nscale 直接回应；Guardian 提供 Nscale 后续回应。中高（该项目客户退出），待验证（合同条款、替代客户与供电时间）。\n- **趋势：** AI 基础设施交付约束持续升温；不能外推为 Microsoft 取消全部 Nscale 合作。\n\n## 连续观察与覆盖缺口\n\n- **较昨日变化：** 昨日以中国技术出海、DeepSeek 模型/搜索、Agent 记忆为主；今日新增公司治理、AI 娱乐重整与算力供电三个不同层面的后续信号，没有可核的新模型/世界模型商用跃迁。\n- **下一轮验证：** Anthropic 基金股东批准与治理文件；Character.AI 竞标与平台存续；Nscale 的电力与客户安排；DeepSeek Search/Fetch 真实任务成本及世界模型长时体验。\n- **采集限制：** 已核官方发布、主流媒体、模型库及中英文线索。对只有转载或预测、无原始材料的新模型与 KOL 说法不单列。以上均非投资或法律建议。\n";
const root = document.getElementById("content");
root.innerHTML = marked.parse(source);
root.querySelectorAll("pre > code.language-mermaid").forEach((code) => {
  const div = document.createElement("div");
  div.className = "mermaid";
  div.textContent = code.textContent;
  code.parentElement.replaceWith(div);

const dark = matchMedia("(prefers-color-scheme: dark)").matches;
mermaid.initialize({ startOnLoad: false, theme: dark ? "dark" : "default", securityLevel: "strict" });
for (const el of root.querySelectorAll(".mermaid")) {
  try { await mermaid.run({ nodes: [el] }); }
  catch (e) { el.classList.add("mermaid-error"); el.textContent = "Mermaid \u8bed\u6cd5\u9519\u8bef\uff1a" + e.message; }
}
document.body.dataset.rendered = "true";
</script>
