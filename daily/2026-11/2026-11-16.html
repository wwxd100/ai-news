<script type="module">
import { marked } from "https://cdn.jsdelivr.net/npm/marked@12/lib/marked.esm.js";
import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";
const source = "# AI 日报 · 2026-11-16\n\n[中文（当前）](2026-11-16.md) · [English](../../en/daily/2026-11/2026-11-16.md)\n\n- **采集截止：** 2026-11-16 11:00（Asia/Shanghai）；检查官方发布、Hugging Face 与科技媒体的最近更新。\n- **本期判断：今日无重大更新。** 以下 1 条是 11 月 12 日官方发布的补漏，不能算作 11 月 16 日新发布。[历史索引](../../INDEX.md) · [上周周报](../../weekly/2026-W46.md)。\n\n## 今日关键结论\n\n1. **本轮没有足够已核实的重大新讯构成 20–30 条常规日报。** 不以旧消息或未经核实的社区转载填充篇幅。\n2. **分类与路由模型值得单独评估。** Perplexity Decider v1.3 交付可下载权重与 API，用于概率判断、抽取和路由；它不是生成式 Agent，其厂商评测须在真实任务上复测。\n\n```mermaid\nflowchart LR\n  A[\"最近发布扫描\"] --> B[\"原始日期与交付核查\"]\n  B --> C[\"今日无重大新讯\"]\n  B --> D[\"11 月 12 日漏项\"]\n  C --> E[\"短版日报\"]\n  D --> E\n```\n\n## 补漏动态\n\n### 1. Perplexity 发布 Decider v1.3 与 Decider Flash v1.3（11 月 12 日补漏）\n\n- **发生了什么：** Perplexity 发布两款决策模型，支持二元/多类判断、分数和 `locate` 文本定位；Flash 为较小的蒸馏版。官方称两款均可通过 Hugging Face 下载 Apache 许可权重，也通过 OpenRouter 与 Decisions API 提供。\n- **为什么重要 / 视角：** 产品决策、技术背景。可在审核、路由和内容标注中比较概率输出、延迟与单位任务成本；阈值应在自有标注集校准。不能把分类器写成会自主执行长任务的 Agent。\n- **发布时间 / 类型 / 原始信源：** 2026-11-12，Perplexity 官方技术博客；[发布说明](https://www.perplexity.ai/hub/blog/perplexity-decider) · [API 社区公告](https://community.perplexity.ai/c/announcements/9)。\n- **交叉验证 / 可信度：** 两处均属发布方，不能当独立交叉验证；权重、许可和接口交付可外部检查，性能提升仍为厂商主张。交付可信度高，效果待独立复测。\n- **趋势：** T01/T04 持续升温；11 月 12 日漏项补录。\n\n## 连续追踪与限制\n\n- **待验证：** 决策模型在真实内容审核和模型路由中的误判、阈值漂移与总成本；上周模型/Agent 发布的权限、许可和长期效果见[W46 周报](../../weekly/2026-W46.md)。\n- **覆盖限制：** “今日无重大更新”只针对本轮核查时段与信源，不代表全球没有 AI 发布。\n";
const root = document.getElementById("content");
root.innerHTML = marked.parse(source);
root.querySelectorAll("pre > code.language-mermaid").forEach((code) => {
  const div = document.createElement("div");
  div.className = "mermaid";
  div.textContent = code.textContent;
  code.parentElement.replaceWith(div);
});
const dark = matchMedia("(prefers-color-scheme: dark)").matches;
mermaid.initialize({ startOnLoad: false, theme: dark ? "dark" : "default", securityLevel: "strict" });
for (const el of root.querySelectorAll(".mermaid")) {
  try { await mermaid.run({ nodes: [el] }); }
  catch (e) { el.classList.add("mermaid-error"); el.textContent = "Mermaid \u8bed\u6cd5\u9519\u8bef\uff1a" + e.message; }
}
document.body.dataset.rendered = "true";
</script>
