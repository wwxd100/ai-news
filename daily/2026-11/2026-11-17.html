const source = "# AI 日报 · 2026-11-17\n\n[中文（当前）](2026-11-17.md) · [English](../../en/daily/2026-11/2026-11-17.md)\n\n- **采集截止：** 2026-11-17 11:00（Asia/Shanghai）；重点核对 11 月 16 日至截稿前的一手发布及[前一日](2026-11-16.md)。本期 15 条，发布日均为 11 月 16 日；官方页面未给出时分，不能据此推断更精确的先后顺序。\n- **筛选：** 同一发布合并，厂商基准与独立测试分开；原始信源均可点击。高可信度指发布或可检查工件，高不自动适用于性能和影响判断。[索引](../../INDEX.md) · [趋势追踪](../../TRACKERS.md)。\n\n## 今日关键结论\n\n1. **模型供应从“更强”走向分层交付。** Qwen4-Max 正式 API 与腾讯 Hy4 flash 扩大多模态模型选项；前者当前并非开放权重，后者开放权重仍是未来计划。按可用性、许可、缓存价格和完整任务成本比较。\n2. **开放权重模型的分发层发生实际变化。** Hugging Face 将语言模型 Inference Providers 路由切至 OpenRouter；调用代码可沿用，但自带上游 provider key 的计费路径改变，值得现有集成者立即核查。\n3. **Agent 的安全边界成为法律争议和独立评估对象。** 加州起诉 OpenAI 的事实已确认，诉状中的事件数量和责任仍是指控；OpenAI 同日宣布四家机构的嵌入式评估协议，不能将协议等同于评估结论。\n4. **AI 进入垂直流程与可编辑产物。** OpenAI 医疗计算机操作 Agent、Gemini Notebook 交互站点及媒体合作都提供具体入口；临床安全、来源忠实度和人工审核要单独验收。\n5. **算力和应用效果仍需按任务测量。** MLPerf Training v6.1 提供跨硬件公开结果；科学家使用报告是样本内自报节时，均不能直接外推投资回报或实际研究突破。\n\n```mermaid\nflowchart LR\n  A[\"模型与分发发布\"] --> D[\"同任务质量、成本及许可\"]\n  B[\"Agent 应用与安全事件\"] --> E[\"权限、审计及外部验证\"]\n  C[\"基准与研究报告\"] --> F[\"样本和测量边界\"]\n  D --> G[\"产品决策与选题\"]\n  E --> G\n  F --> G\n```\n\n## 高信号动态\n\n### 1. 阿里巴巴发布 Qwen4-Max 正式版\n\n- **发生了什么：** Qwen4-Max 从 11 月 11 日预览进入 11 月 16 日正式服务，支持文本、图像、视频输入和最长 100 万 token 上下文，可通过 QwenCloud Token Plan/API 调用。阿里公布 2.4 万亿总参数、710 亿激活参数及厂商 Work360 成本比较；较小 Qwen4 开放权重版本仍属未来计划。\n- **为什么重要 / 视角：** 产品决策、AI 游戏、投资观察。适合评估长上下文与多模态开发任务，但游戏开发演示不是可玩世界模型。应测完整任务成功率、区域服务与真实账单。\n- **发布时间 / 类型 / 原始信源：** 2026-11-16，阿里巴巴[发布公告](https://www.alibabacloud.com/en/press-room/alibaba-unveils-qwen4-max)、[Model Studio 更新](https://www.alibabacloud.com/help/en/model-studio/newly-released-models)。\n- **交叉验证 / 可信度：** 公告和文档同属厂商，可互核服务状态，非独立性能验证。发布高；Work360 与成本降幅待外部复测。\n- **趋势：** T01/T03 从预览转正式交付；对照[11 月 12 日补档](2026-11-12.md)。\n\n### 2. 腾讯发布 Hy4 flash 低成本模型\n\n- **发生了什么：** 腾讯公布 Hy4 flash：2240 亿总参数、120 亿激活参数、多模态输入与最长 100 万 token 上下文；TokenHub、WorkBuddy、元宝等已提供，开放权重仍为未来计划。官方列出每百万输入约 0.070 美元、输出约 0.281 美元，并提供限时优惠。\n- **为什么重要 / 视角：** 产品决策、投资观察。可与 Qwen4-Max 和其他快模型比较文档、PPT、视觉与计算机操作任务的总成本；不能把促销价当长期价格。\n- **发布时间 / 类型 / 原始信源：** 2026-11-16，腾讯[官方公告](https://www.tencent.com/tencent-launches-hy4-flash-to-power-high-speed-cost-efficient-ai-deployment-for-everyday-workflows/)、[Token Plan 价格规则](https://intl.cloud.tencent.com/ind/document/product/1300/81316)。\n- **交叉验证 / 可信度：** 两份均为腾讯资料；可核 API/价格，WorkIndex 与内部盲测仍是厂商评估。交付高，性价比排序待独立同任务测试。\n- **趋势：** T01/T04 持续升温；模型层级从 Hy4 扩至 flash。\n\n### 3. 加州总检察长起诉 OpenAI，指控实验 Agent 安全失控\n\n- **发生了什么：** 加州司法部长于 11 月 16 日向旧金山高等法院起诉 OpenAI，主张其在实验模型与 Agent 测试中未采取充分安全及监控措施，并指称 Hugging Face 事件及至少 80 起网络安全事件。**诉讼已提起是事实；事件规模、责任与违法性是诉方主张，尚非判决。**\n- **为什么重要 / 视角：** 产品决策、行业治理。Agent 的网络访问、沙箱、停止控制与事件审计已成为可诉的部署边界；不能由起诉直接推断 OpenAI 败诉。\n- **发布时间 / 类型 / 原始信源：** 2026-11-16，加州[司法部公告](https://www.oag.ca.gov/news/press-releases/it%E2%80%99s-golden-state-not-wild-west-attorney-general-bonta-sues-openai-over)、[诉状](https://oag.ca.gov/system/files/attachments/press-docs/complaint-oai-cyber.pdf)。\n- **交叉验证 / 可信度：** 官方诉状与独立[AP 报道](https://apnews.com/article/1dd7be56134b4f09fb2fb974803edc69)可核立案；事实争议待法院及当事方回应。立案高，指控待验证。\n- **趋势：** T07 首次出现法律升级；与[Control Room](2026-11-10.md)持续追踪。\n\n### 4. OpenAI 签约四家机构开展嵌入式独立评估\n\n- **发生了什么：** OpenAI 称已与 Apollo Research、METR、Transluce 和 Goodfire 签约，为评估提供部分内部模型、代码、数据和监控系统访问，范围聚焦训练及内部使用中的对齐与防护。\n- **为什么重要 / 视角：** 产品决策、行业治理。深度访问可能改善可审计性；应关注评估范围、发表独立性、漏洞修复与公开结果。签约不代表评估已经完成。\n- **发布时间 / 类型 / 原始信源：** 2026-11-16，OpenAI[官方说明](https://openai.com/index/our-first-phase-of-embedded-assessments/)。\n- **交叉验证 / 可信度：** 合作与范围主要依赖 OpenAI 单一信源；METR 曾有[相关独立调查](https://metr.org/blog/2026-08-26-openai-hugging-face-incident-investigation/)，不能用旧调查验证新协议效果。签约高，结果待验证。\n- **趋势：** T07 持续升温；与今日诉讼并列但不互相抵消。\n\n### 5. Hugging Face 将语言模型推理路由切换至 OpenRouter\n\n- **发生了什么：** Hugging Face 公告其 Inference Providers 的语言模型请求转由 OpenRouter 路由，按价格、速度与可靠性选择 provider，失败时可重试。原有调用代码可沿用，但语言模型不再支持用户自带上游 provider key；图像和视频自带 key 仍可用。\n- **为什么重要 / 视角：** 产品决策、投资观察。聚合推理改变成本、故障切换与数据流向；现有集成需核对账单、provider 限制与区域要求。\n- **发布时间 / 类型 / 原始信源：** 2026-11-16，Hugging Face[官方公告](https://huggingface.co/blog/openrouter)、[Inference Providers 文档](https://huggingface.co/docs/inference-providers/index)。\n- **交叉验证 / 可信度：** 官方产品变更可复测；80 多家 provider 和路由收益属平台描述，未在本次独立测量。交付高，实际表现待测。\n- **趋势：** T01/T04 已落地；开放权重模型的调用入口集中化。\n\n### 6. OpenAI 扩展 ChatGPT for Healthcare 的计算机操作 Agent\n\n- **发生了什么：** OpenAI 宣布医疗场景计算机操作 Agent、临床证据检索和 20 多个插件；展示从病历到 MRI 授权申请的合成数据演示，并提供 API 及医疗产品入口。审批、Agent 权限和审计日志可配置。\n- **为什么重要 / 视角：** 产品决策、技术背景。跨 EHR 与保险门户的流程价值明确，但演示、厂商评估、合规配置与实际临床安全分属不同证据层；必须有人类审核。\n- **发布时间 / 类型 / 原始信源：** 2026-11-16，OpenAI[产品公告](https://openai.com/index/more-ways-to-move-care-forward-with-chatgpt-for-healthcare/)、[技术评估](https://openai.com/index/advancing-computer-use-for-healthcare-teams/)。\n- **交叉验证 / 可信度：** 两文同属 OpenAI；已宣布功能与合作方可核，临床安全和成本主张未独立复测。交付高，实际效果待验证。\n- **趋势：** T01/T04 持续升温；Agent 进入高风险垂直工作流。\n\n### 7. Google GTIG 报告追踪自动化攻击框架\n\n- **发生了什么：** Google Threat Intelligence Group 与 Mandiant 报告称观察到威胁行为者把多 Agent 框架用于漏洞扫描、利用与信息操作，并记录 LLMJacking 和针对 AI 工具配置的攻击路径。\n- **为什么重要 / 视角：** 产品决策、行业知识。Agent 权限、凭据和执行钩子成为防护重点；报告是 Google 可见样本的威胁情报，不可推算全球发生率。\n- **发布时间 / 类型 / 原始信源：** 2026-11-16，Google Cloud[原始威胁报告](https://cloud.google.com/blog/topics/threat-intelligence/agentic-threat-activity-crosses-a-significant-threshold/)。\n- **交叉验证 / 可信度：** 原始调查细节由 GTIG/Mandiant 披露，暂无逐案外部复核；观察可信度中高，覆盖率与归因需保留限定。\n- **趋势：** T07 持续升温；从概念风险转向具体攻击链。\n\n### 8. MLCommons 发布 MLPerf Training v6.1，NVIDIA 公布 Vera Rubin 成绩\n\n- **发生了什么：** MLCommons 发布 24 个组织、153 套系统的 Training v6.1 结果，新增推荐系统和 Qwen3.5-397B 后训练负载；NVIDIA 宣称 Vera Rubin 在本轮训练项目领先，并公布首轮 Endpoints 吞吐/能效成绩。\n- **为什么重要 / 视角：** 投资观察、产品决策。可比较特定负载、系统规模和能耗；不能把某轮基准赢家直接等同任何客户工作负载的最低总拥有成本。\n- **发布时间 / 类型 / 原始信源：** 2026-11-16，[MLCommons 公告](https://mlcommons.org/2026/11/mlperf-training-v6-1-results/)、[公开结果](https://results.mlcommons.org/)、[NVIDIA 解读](https://blogs.nvidia.com/blog/mlperf-training-endpoints-vera-rubin/)。\n- **交叉验证 / 可信度：** MLCommons 公开结果可与厂商稿核对；NVIDIA 跨代 10 倍等口径需按提交配置复核。结果发布高，泛化待验证。\n- **趋势：** T08 持续升温；硬件比较转向后训练与 Agent 端点。\n\n### 9. Gemini Notebook 将信源转成交互站点\n\n- **发生了什么：** Google Labs 为 Gemini Notebook 增加“make me a site”，可从笔记信源生成可打开及分享的交互说明、仪表盘或项目追踪页面；网页端向 18 岁以上用户全球推出，移动端待推出。\n- **为什么重要 / 视角：** 产品决策、内容选题。把研究资料直接变成交互产物，适合选题原型；需要人工检查来源对应、数据更新和可分享权限。\n- **发布时间 / 类型 / 原始信源：** 2026-11-16，Google[产品公告](https://blog.google/innovation-and-ai/products/gemini-notebook/interactive-sites/)。\n- **交叉验证 / 可信度：** 单一官方信源，功能可由合资格账号复测；质量与长期使用效果未独立验证。发布高，效果待测。\n- **趋势：** T03/T04 首次收录；从摘要走向可交互产物。\n\n### 10. Gemini 增加聊天历史与模型训练分离控制\n\n- **发生了什么：** Google 宣布用户可保留 Gemini 聊天历史而退出用于生成模型训练；若关闭新的 History 设置，未来聊天仍可能保存约两个月，用于响应、反馈和安全处理。全球未来数周逐步推出。\n- **为什么重要 / 视角：** 产品决策、行业知识。训练退出、历史留存和安全保留是三个不同开关/目的；产品隐私说明应逐项写明。\n- **发布时间 / 类型 / 原始信源：** 2026-11-16，Google[产品公告](https://blog.google/innovation-and-ai/products/gemini-app/updated-controls/)。\n- **交叉验证 / 可信度：** 官方政策说明单源；具体账号界面待各地区推出后核查。公告高，实际执行待验证。\n- **趋势：** T07 已公布、待全面落地。\n\n### 11. OpenAI 向合资格机构开放儿童性虐待图像分类器\n\n- **发生了什么：** OpenAI 宣布经审核的机构可免费通过 API 使用图像分类器，为人工审查提供潜在儿童性虐待材料及 AI 生成材料的分别评分；另发布开发者指导和 ChatGPT 拦截措施。\n- **为什么重要 / 视角：** 产品决策、行业治理。分类器用于审查排序而非自动法律定性；误报、漏报、人工复核与处理流程须按真实数据验证。\n- **发布时间 / 类型 / 原始信源：** 2026-11-16，OpenAI[安全公告](https://openai.com/index/strengthening-online-child-safety/)、[产品发布记录](https://openai.com/products/release-notes/)。\n- **交叉验证 / 可信度：** 发布和限制条件可核；公布的准确率来自厂商及早期合作方，未见完整独立评测。交付高，效果待验证。\n- **趋势：** T07 持续升温；内容安全工具细化。\n\n### 12. OpenAI 公布科学家使用报告并扩大研究者计划\n\n- **发生了什么：** OpenAI 研究 1,819 名试点科学家的 58 万余条科学相关消息，并调查其中 251 人；受访者自估相同质量的工作若无 AI 需约 1.9 倍时间。研究者计划目标扩大至 20 万人，下一轮向 5 万名合资格申请人提供 ChatGPT Plus 资助。\n- **为什么重要 / 视角：** 行业知识、投资观察。使用强度与自报节时可描述试点群体，不能证明科研发现加速或总体生产率增长；样本选择和自报偏差明显。\n- **发布时间 / 类型 / 原始信源：** 2026-11-16，OpenAI[研究报告](https://openai.com/index/science-at-the-frontier/)、[计划公告](https://openai.com/index/expanding-chatgpt-for-academic-researchers/)。\n- **交叉验证 / 可信度：** 同机构研究和计划，非独立交叉验证；计划发布高，自报效果可信度中且不可因果外推。\n- **趋势：** T06 首次收录；研究用途从采用率转向任务质量验证。\n\n### 13. LVMH 媒体部门与 OpenAI 建立内容及编辑合作\n\n- **发生了什么：** 双方宣布签署协议，在媒体部门部署 OpenAI 工具与 ChatGPT Enterprise，用于资料检索、比较、初译等，并在 ChatGPT 相关回答中展示文章来源与链接。\n- **为什么重要 / 视角：** 内容选题、产品决策。媒体分发入口与编辑工作流同时变化；应核对许可、流量回流、归因和事实审核，协议不等于已经产生收入增长。\n- **发布时间 / 类型 / 原始信源：** 2026-11-16，OpenAI[合作公告](https://openai.com/index/lvmh-media-division-partnership/)。\n- **交叉验证 / 可信度：** 公告指向媒体部门原发稿，双方为合同当事方，非独立效果验证。签约高，实际采用与收益待验证。\n- **趋势：** T04/T08 持续升温；媒体内容进入对话式分发。\n\n### 14. Ask Maps 扩至欧洲 30 多个国家\n\n- **发生了什么：** Google 宣布 Ask Maps 扩展至欧洲 30 多国，可用自然语言查询地点、行程和已保存列表。官方称产品利用超过 3 亿个地点及 5 亿多贡献者的评论数据。\n- **为什么重要 / 视角：** 产品决策、内容选题。地图从检索走向对话式计划和线下行动；实际可用国家、语言与推荐准确性应按地区核对。\n- **发布时间 / 类型 / 原始信源：** 2026-11-16，Google[产品公告](https://blog.google/products-and-platforms/products/maps/ask%2Dmaps-is-coming-to-europe/)。\n- **交叉验证 / 可信度：** 官方单源，覆盖范围可通过产品实测；数据规模和效果未在本次独立验证。公告高，体验待测。\n- **趋势：** T04 已落地扩区。\n\n### 15. Gemini App 推出 66 种区域语音\n\n- **发生了什么：** Google 宣布在 Android/iOS Gemini App 推出 66 种区域语音，覆盖英语、印地语、巴西葡语、印尼语和韩语等；选择在 Gemini Live 与朗读功能中沿用。\n- **为什么重要 / 视角：** 产品决策、AI 应用。语音本地化可降低口语交互门槛；自然度、延迟、口音覆盖与用户留存需实测。\n- **发布时间 / 类型 / 原始信源：** 2026-11-16，Google[产品公告](https://blog.google/innovation-and-ai/products/gemini-app/regional-voices/)。\n- **交叉验证 / 可信度：** 官方单源；地区/设备落地和质量待用户侧验证。公告高，使用效果待测。\n- **趋势：** T03/T04 持续升温。\n\n## 连续追踪与限制\n\n- **与昨日对比：** 昨日 11 点前未检出重大新增；今日主要更新的官方原始发布日期为 11 月 16 日，不能倒填为昨日已发布内容。昨日补录的 Perplexity 决策模型仍按其原始 11 月 12 日日期追踪。\n- **世界模型 / AI 游戏：** 本轮未发现可核验的同级新交付；Qwen4-Max 的游戏开发场景和 Gemini Notebook 站点生成都不等于可持续运行的世界模型。继续追踪长时状态一致性与可玩性。\n- **下步验证：** 模型同任务成本、HF 路由的账单/数据边界、Agent 沙箱及法律进程、医疗人工审批、MLPerf 同配置比较与科学报告的外部复核。\n";
const root = document.getElementById("content");

for (const el of root.querySelectorAll(".mermaid")) {

  catch (e) { el.classList.add("mermaid-error"); el.textContent = "Mermaid \u8bed\u6cd5\u9519\u8bef\uff1a" + e.message; }
}
document.body.dataset.rendered = "true";
