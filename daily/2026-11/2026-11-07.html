import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";
const source = "# AI 日报 · 2026-11-07\n\n[中文（当前）](2026-11-07.md) · [English](../../en/daily/2026-11/2026-11-07.md)\n\n- **采集截止：** 2026-11-07 11:00（Asia/Shanghai）。来源只标日期时，不推断精确发布时间。\n- **本期性质：** 5 条高信号短版，其中 4 条标注 11 月 5 日、1 条 11 月 4 日补漏；不以重复报道凑足常规 20–30 条。\n- **导航：** [历史索引](../../INDEX.md) · [趋势追踪](../../TRACKERS.md)。\n\n## 今日关键结论\n\n1. **视频生成开始按可编辑片段而非单次生成定价。** Google 发布 Gemini Omni 1.2 Flash，称支持最长 15 秒、对话式反复编辑；720p 标价每秒 0.07 美元，较前版降价 30%。一致性和实际返工成本仍需独立测试。\n2. **网络安全模型能力与授权边界同步升级。** OpenAI 发布 GPT-6 Cyber，仅向获批的 Daybreak Red 用户开放；厂商在 ExploitGym 和越界行为测试中报告明显提升，但受控测试不等于所有真实环境安全。\n3. **开放权重不等于开放许可。** 百度交付 ERNIE-5.5-Flash-Base 预训练权重，其许可排除欧盟、英国、韩国，商业用途需遵守通知、署名及收入门槛；它也不是已完成指令微调的聊天模型。\n4. **AI 加速 AI 研发有了高权限外部评估，但公开证据仍有限。** METR 估计 Anthropic 在特定可量化任务上的能力进步速度约为既往两倍；区间、归因和被删节证据使其不能泛化为全行业规律。\n5. **编码 Agent 并购直接影响现有用户迁移。** Conductor 宣布加入 Meta，Cloud 将在 11 月 13 日只读、20 日停止；这比并购叙事更直接影响工作区与数据导出。\n\n```mermaid\nflowchart LR\n  A[\"发布与研究结论\"] --> B[\"可验证的交付和限制\"]\n  B --> C[\"独立任务测试\"]\n  C --> D[\"产品采用与持续观察\"]\n```\n\n## 重点动态\n\n### 1. Google 发布 Gemini Omni 1.2 Flash 视频模型\n\n- **发生了什么：** Google 称 Gemini Omni 1.2 Flash 已在 Gemini API 和 Gemini for business 正式可用，可原生生成最长 15 秒视频，并在同一片段上多轮对话编辑、使用图像、短动作片段和音频参考。官方将 720p 定价为每秒 0.07 美元，称较 Omni 1.1 降价 30%。\n- **为什么重要 / 视角：** 产品决策、内容选题、AI 游戏。短视频资产制作可以围绕保留角色、商品和场景的局部修改组织；但厂商演示不能代替跨镜头一致性、返工次数和交付总成本测试。它不是可持续运行的游戏世界模型。\n- **发布时间 / 类型 / 原始信源：** 2026-11-05，Google 产品公告；[Google 原文](https://blog.google/innovation-and-ai/technology/developers-tools/introducing-gemini-omni-1-2-flash/)。\n- **交叉验证 / 可信度：** 上线、功能和标价见官方页面；质量和成本优势是厂商主张，本轮未独立复测。高（发布与标价），待验证（生产效果）。\n- **趋势：** T02/T05 持续升温；承接可编辑图像工作流，转向可多轮修订的视频片段。\n\n### 2. OpenAI 发布 GPT-6 Cyber，并限制 Daybreak Red 访问\n\n- **发生了什么：** OpenAI 发布专用网络安全模型 GPT-6 Cyber，仅供获批的 Daybreak Red 组织使用。其自建 ExploitGym 结果为 48.5%，高于 GPT-5.6 Cyber 的 32.1%；越界目标测试中，官方报告在加入部署提示时 100% 留在授权范围。OpenAI 将模型网络安全能力分级为 Critical。API 文档列明获批条件与标价。\n- **为什么重要 / 视角：** 产品决策、投资观察、技术背景。模型能力、身份核验、网络白名单和行为监控成为同一产品设计；基准成绩与受控越界测试不能视为真实攻击面中的安全保证。\n- **发布时间 / 类型 / 原始信源：** 2026-11-05，官方产品公告及系统卡；[OpenAI 发布说明](https://openai.com/index/introducing-gpt-6-cyber/) · [系统卡](https://deploymentsafety.openai.com/gpt-6-cyber/) · [API 文档](https://developers.openai.com/api/docs/models/gpt-6-cyber)。\n- **交叉验证 / 可信度：** 三份材料同属 OpenAI，不构成独立验证；[Mozilla 安全公告](https://www.mozilla.org/en-US/security/advisories/mfsa2026-118/)列出部分 OpenAI 研究员报告的已修复漏洞，但不能验证厂商公布的全部漏洞数量或模型归因。高（发布与限制），待验证（普遍性能和安全边界）。\n- **趋势：** T07 持续升温；与昨日 Linux 研究和 Daybreak Red 的基础设施分发形成连续信号。\n\n### 3. 百度开放 ERNIE-5.5-Flash-Base 预训练权重\n\n- **发生了什么：** 百度发布 280B 总参数、每 token 激活 14B 的 MoE 基座权重；预训练长度上限 128K，官方称微调与推理可支持 1M 上下文。它是未经中训练和后训练的预训练终点，不应写成可直接替代聊天助手的指令模型。权重已列于 Hugging Face；许可地域排除欧盟、英国和韩国。相关产品或服务年收入不超过 5000 万美元的商业使用需事先通知并展示“Powered by ERNIE”，超过该门槛需另获书面授权。\n- **为什么重要 / 视角：** 产品决策、投资观察。模型团队获得进一步训练起点，但部署需同时核算整模型显存、长上下文成本和许可适用范围；“可下载”不等于无条件开源。\n- **发布时间 / 类型 / 原始信源：** 2026-11-05，百度技术公告、模型卡与许可；[百度原文](https://ernie.baidu.com/zh/release/ernie-5-5-flash-base/) · [模型权重](https://huggingface.co/baidu/ERNIE-5.5-Flash-Base) · [许可全文](https://huggingface.co/baidu/ERNIE-5.5-Flash-Base/blob/main/LICENSE)。\n- **交叉验证 / 可信度：** 权重与截至本期截稿时的许可文本可直接查验，但均由百度提供；性能和 1M 上下文的实际质量尚未独立复测。高（交付及许可文本），待验证（能力与成本）。\n- **趋势：** T03 持续升温；与 Mistral Large 4 一样，权重开放后的许可审查成为采购前置项。\n\n### 4. METR 评估 Anthropic 的 AI 研发加速\n\n- **发生了什么：** 独立研究机构 METR 获得 Anthropic 内部数据和访谈访问权后，估计其在可明确评测任务上的模型能力进步速度约为 2024 年 3 月至 2025 年 10 月时期的两倍；报告中的 AECI 趋势估计为 1.9 倍，95% 区间为 1.5–2.8 倍。METR 判断 AI 辅助研发可能贡献了大部分加速，但明确保留其他因素和归因不确定性。Anthropic 删节了部分关键证据。\n- **为什么重要 / 视角：** 投资观察、内容选题、技术背景。它提供了比厂商自述更高权限的观察窗口，但单公司、可量化任务和被删节的底层证据限制了公众复核，不能写成全行业 AI 自我改进已被证明。\n- **发布时间 / 类型 / 原始信源：** 2026-11-05，独立研究机构报告；[METR 原文](https://metr.org/blog/2026-11-05-anthropic-ai-rd-acceleration-assessment/)。\n- **交叉验证 / 可信度：** 对内部过程是第三方评估，公开材料仍不足以独立重算关键结论；高（报告存在及方法披露），中（加速估计），待验证（因果归因和外推）。\n- **趋势：** T01/T07 首次出现、待验证；持续看可公开复核的任务数据与其他实验室结果。\n\n### 5. Conductor 宣布加入 Meta（11 月 4 日补漏）\n\n- **发生了什么：** 编码 Agent 产品 Conductor 的团队宣布加入 Meta，停止新用户注册；Conductor Cloud 计划 11 月 13 日转为只读、11 月 20 日关闭，并提供云端工作区转本地及数据导出路径。官方称本地应用仍将接收新模型和关键修复至 2027 年初；下一代产品细节尚未披露。\n- **为什么重要 / 视角：** 产品决策、投资观察。Agent 工具竞争伴随工作区迁移和数据持续性风险；用户应关注导出节点，不能把团队加入 Meta 直接等同为新产品已交付。\n- **发布时间 / 类型 / 原始信源：** 2026-11-04，公司公告；[Conductor 原文](https://www.conductor.build/announcement) · [产品变更日志](https://www.conductor.build/changelog)。\n- **交叉验证 / 可信度：** 两页均由 Conductor 发布，不是独立互证；Meta 后续整合与产品方向未验证。高（公告与迁移时间表），待验证（后续产品）。\n- **趋势：** T01/T06 首次补录、待验证；与 OpenAI 拟收购 Pierre 共同反映编码 Agent 工具整合。\n\n## 连续追踪与限制\n\n- **持续升温：** 多轮可编辑生成、专用安全模型的限制分发、开放权重的定制化许可。\n- **待验证：** 视频跨片段一致性与真实成本；GPT-6 Cyber 的外部安全评估；ERNIE 长上下文质量与部署成本；METR 因果归因及外部可复核证据；Conductor 用户迁移与新产品。\n- **覆盖限制：** 本期以 11 月 5 日官方发布为主，含一条 11 月 4 日补漏；未找到足够多经核实的新 AI 游戏或可玩世界模型交付。仅标日期的页面不推断具体发布时间。\n\n> 行业资讯；重要决策请复核原始信源、许可和适用条件。\n";
const root = document.getElementById("content");
root.innerHTML = marked.parse(source);
root.querySelectorAll("pre > code.language-mermaid").forEach((code) => {
  const div = document.createElement("div");
  div.className = "mermaid";
  div.textContent = code.textContent;
  code.parentElement.replaceWith(div);

const dark = matchMedia("(prefers-color-scheme: dark)").matches;
mermaid.initialize({ startOnLoad: false, theme: dark ? "dark" : "default", securityLevel: "strict" });
for (const el of root.querySelectorAll(".mermaid")) {
  try { await mermaid.run({ nodes: [el] }); }
  catch (e) { el.classList.add("mermaid-error"); el.textContent = "Mermaid \u8bed\u6cd5\u9519\u8bef\uff1a" + e.message; }
}
document.body.dataset.rendered = "true";
</script>
