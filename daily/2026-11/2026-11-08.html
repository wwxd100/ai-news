import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";
const source = "# AI 日报 · 2026-11-08\n\n[中文（当前）](2026-11-08.md) · [English](../../en/daily/2026-11/2026-11-08.md)\n\n- **采集截止：** 2026-11-08 11:00（Asia/Shanghai）；本期实际核查于 12:48 后完成。仅按原始页面标注日期收录，不推断精确上线时刻。\n- **本期性质：** 周日 3 条高信号短版；没有用转载或未经核实的发布凑足常规 20–30 条。\n- **导航：** [历史索引](../../INDEX.md) · [趋势追踪](../../TRACKERS.md)。本周周报在 11 月 8 日结束后生成。\n\n## 今日关键结论\n\n1. **持久游戏世界可用于检验 Agent 的经济决策和团队信任，但不能把游戏收益外推为真实投资能力。** Anthropic 在 EVE Online 的历史订单回放中观察到模型赚取游戏币；在 EVE Frontier 的实时团队任务中，模型依赖专门脚手架处理快速操作，且未完成最难的战舰目标。\n2. **多模态 Agent 的某些步骤可交给输出结构化判断的专用模型。** Kakao 开放 Kanana-2-v-decide 权重，输入可含文字和图片，输出选项概率、是非概率或分级分数；它不生成自然语言，不等于一个能独立执行任务的 Agent。\n3. **安全模型的落地转向研究者与厂商的协作测试。** OpenAI 宣布与 Hacktron 合作检查自家系统及第三方服务连接，并扩大其 Daybreak Red 访问；合作范围已宣布，实际修复成效仍待披露。\n\n```mermaid\nflowchart LR\n  A[\"游戏与业务环境\"] --> B[\"Agent 决策和工具调用\"]\n  B --> C[\"可观察的失败与约束\"]\n  C --> D[\"改进模型、脚手架与安全测试\"]\n```\n\n## 重点动态\n\n### 1. Anthropic 用 EVE 测试游戏市场交易与多 Agent 协作\n\n- **发生了什么：** Anthropic 披露 Project EVE：在 EVE Online 的历史订单回放中测试 Claude 交易，较新模型主要靠低风险价差策略获利；这不是实时交易，市场不会对智能体订单产生反应。在 EVE Frontier 的实时游戏中，四个 Claude Agent 组队做长期任务，需由 Fable 5 编写的脚手架处理亚秒级战斗操作；团队可完成较简单教程，但最远只完成战舰目标约一半。加入秘密破坏者后，队友很少发现异常。\n- **为什么重要 / 视角：** AI 游戏、产品决策、投资观察、技术背景。游戏可为长时协作、对抗和经济行为提供可观察环境；但回放市场不等于真实金融市场，定制脚手架不等于基础模型具备实时操作能力，也不能据此证明游戏已可由 AI 自动生成。\n- **发布时间 / 类型 / 原始信源：** 2026-11-06，Anthropic 研究文章；[Project EVE 原文](https://www.anthropic.com/research/project-eve-claude-plays-mmorpgs) · [EVE AI Lab 合作方页面](https://lab.eve.com/)。\n- **交叉验证 / 可信度：** 双方页面共同确认研究合作；收益、任务完成率与破坏者识别率主要来自 Anthropic 实验，未独立复测。高（实验与合作披露），待验证（泛化及真实业务预测价值）。\n- **趋势：** T01/T05 持续升温；与 GameScaling 的游戏操作智能体、世界模型的环境生成能力分开追踪。\n\n### 2. Kakao 开放多模态决策模型 Kanana-2-v-decide 权重\n\n- **发生了什么：** Kakao 发布基于 Kanana-2-v-3b 的决策模型，输入支持文字、JSON、聊天历史及图片，输出选择题、是非判断或评分的概率分布，而非自由文本。模型卡提供权重和示例；Kakao 在其比较的公开评测与自建韩文评测中报告优势，性能数字尚未独立复现。权重采用 Kanana Open License，具体商业条款需核对。\n- **为什么重要 / 视角：** 产品决策、内容选题、技术背景。客服分类、商品图判断与 Agent 工具选择可能用结构化模型减少生成式回答后再抽取的步骤；仍需在真实业务样本上验证校准、延迟和错误代价。\n- **发布时间 / 类型 / 原始信源：** 2026-11-06，Kakao 公司公告与模型卡；[Kakao 公告](https://www.kakaocorp.com/page/detail/12193) · [Hugging Face 权重和模型卡](https://huggingface.co/kakaocorp/kanana-2-v-decide-3b-2611)。\n- **交叉验证 / 可信度：** 公告与模型卡均来自 Kakao，不构成独立互证；权重存在可检查。高（交付），待验证（基准可复现性与产品收益）。\n- **趋势：** T01/T02 首次出现、待验证；小型多模态决策组件与通用 Agent 分工更细。\n\n### 3. OpenAI 与 Hacktron 合作测试自身系统安全\n\n- **发生了什么：** OpenAI 宣布与安全研究团队 Hacktron 共同选定高优先级区域测试，重点是其系统与第三方服务之间的连接，并扩大 Hacktron 对 Daybreak Red 的访问。公告未给出本次合作的新漏洞数量、修复结果或独立审计结论。\n- **为什么重要 / 视角：** 产品决策、内容选题。随着 Agent 连通外部工具，身份、权限与服务边界成为实际攻击面；研究合作说明测试安排，不应写成安全问题已解决。\n- **发布时间 / 类型 / 原始信源：** 2026-11-06，OpenAI 公司公告；[OpenAI 原文](https://openai.com/index/partnering-with-hacktron/)。\n- **交叉验证 / 可信度：** 单一官方公告；合作交付与漏洞修复成效尚无独立披露。高（合作公告），待验证（修复和防御收益）。\n- **趋势：** T07 持续升温；承接 GPT-6 Cyber 的受限分发与前期漏洞研究。\n\n## 连续追踪与限制\n\n- **持续升温：** 游戏成为多 Agent 评估环境；结构化多模态判断进入 Agent 工作流；网络安全模型的限制访问与外部研究合作。\n- **待验证：** Project EVE 对真实业务的预测价值、无专门脚手架时的表现；Kanana 在中文和真实图片上的校准及成本；Hacktron 合作后的可披露修复结果。\n- **覆盖限制：** 本期三条均标注 11 月 6 日；周末未找到同等级可核实的 11 月 7 日新模型或世界模型交付。EVE 市场回放、实时游戏任务和游戏生成是不同事项。\n\n> 行业资讯；重要决策请复核原始信源、许可与适用条件。\n";
const root = document.getElementById("content");
root.innerHTML = marked.parse(source);
root.querySelectorAll("pre > code.language-mermaid").forEach((code) => {
  const div = document.createElement("div");
  div.className = "mermaid";
  div.textContent = code.textContent;
  code.parentElement.replaceWith(div);
});
const dark = matchMedia("(prefers-color-scheme: dark)").matches;
mermaid.initialize({ startOnLoad: false, theme: dark ? "dark" : "default", securityLevel: "strict" });
for (const el of root.querySelectorAll(".mermaid")) {
  try { await mermaid.run({ nodes: [el] }); }
  catch (e) { el.classList.add("mermaid-error"); el.textContent = "Mermaid \u8bed\u6cd5\u9519\u8bef\uff1a" + e.message; }
}
document.body.dataset.rendered = "true";
</script>
