const source = "# 持续趋势追踪\n\n更新日期：2026-10-25（10-25 版为晚间补漏；10-24 版于 10-23 21:30 提前生成；10 月 1–4 日、6 日、10–11 日为事后补档）\n\n```mermaid\nflowchart LR\n  A[\"发布与演示\"] --> B[\"可用产品与工具\"]\n  B --> C[\"独立任务复测\"]\n  C --> D[\"长期效果与商业验证\"]\n  E[\"事故与反向证据\"] --> C\n```\n\n## T01 · Agent 从聊天工具转向持续执行系统\n\n- **状态：加速**\n- **10 月 25 日补漏：** Google Cloud 10 月 22 日推出 Anthropic 管理的 Claude 部署方式；同一采购入口下，Anthropic/Google 管理模式的数据处理者、条款及新功能节奏不同。不能仅凭“同在 GCP”推定治理边界一致。\n- **10 月 24 日增量：** MiniMax M3.1 Flash 权重交付，Agent、编程与 Computer Use 多一个可自托管选项，但社区许可设署名与年收入 2000 万美元门槛；Google Cloud 正式提供 OpenAI 模型与 Codex；Robinhood Ventures 向 Cognition 投资 1000 万美元。交付、分发与资本分别跟踪，榜分与留存未独立验证。\n- **10 月 23 日增量：** OpenAI Decisions API 从有限预览转为正式可用；ThinkingBox 训练报告用数据库最终状态给奖励，重复 20 次全部成功任务增加，但至少成功一次的任务减少。前者是产品交付，后者的研究指标尚未独立复现；Agent 验收要同时看覆盖面、稳定性与权限。\n- **10 月 22 日增量：** OpenAI 模型进入 Google Cloud 部分企业私有预览，NVIDIA OpenShell 公开 Agent 运行时外部权限控制；科研 Agent 案例把任务分解和专家复核串起来。模型分发、代码公开与科研线索不等于生产任务成效。\n- **10 月 21 日增量：** OpenAI 收购 Orchestra Bio，Google 把 Gemini 的个性化和小企业入口扩到具体场景；Antigravity 纳入 Claude 5.5，Terminal X 客户案例提出 54 项规则评估。收购、发布与客户自述并不等于任务成功率或投资回报率已经独立验证。\n- **10 月 20 日增量：** MiniMax M3.1 Flash 已进入 API/产品，OpenAI 公开低资源语言编程评测；Google Cloud MCP Apps 指向对话内可编辑交付物。模型榜分、工具演示与实际任务完成率仍须分开。另据 Google Workspace 更新，Workspace Skills 排期延期，具体首发时间尚待核实。\n- **10 月 18 日增量：** DeepSeek 1017 更新开放权重并公开 Search/Fetch API；腾讯交付专门的长期记忆写入模型，AtMem 社区复盘则说明离线准确率可能掩盖高价值信息漏写。工具层、状态写入与任务成本需一并验收。\n- **10 月 17 日增量：** Beam 权重交付、Ling 3.1 作为 14 日补漏，扩充可获取的长上下文 Agent 模型；Anthropic 内部研究显示监督注意力成为瓶颈、初级技术招聘占比下滑，但仅是一家公司。游戏 Agent 脚手架研究提示环境特定控制与 token 成本仍关键。\n- **10 月 16 日增量：** Meta Muse Spark Open、Step 5 Preview 和 Nemotron 3.5 扩大可用模型选择；Bee 将持续上下文带入硬件，Pluralsight AI MCP 与 Minos 分别把企业学习/科学实验转成 Agent 任务环境。开放权重和环境发布不自动证明端到端可靠性。\n- **10 月 15 日增量：** OpenAI 欧盟客户报告显示 Agent 产品输出 token 份额上升；同时宣布指定 GPT-4o/GPT-4.1 API 快照及微调版于 2027 年 1 月 14 日停用，迁移验收成为运营约束。Third Moment 自述万级、36–48 小时 Agent 流程；a16z 提出跨长期客户旅程的商业观点。分别是平台统计、客户案例与投资判断，不能合并证明 ROI。\n- **10 月 14 日增量：** Gemini 4 Argon 扩大付费 API/订阅可用性；Anthropic 自述日合并量增长迫使其建 Scion。二者分别是模型入口与开发基础设施，均需真实任务质量/成本复测。\n- **10 月 13 日增量：** Meta Muse Wonder 将跨会话记忆、持续执行与敏感动作确认写入模型/产品定位；DigitalOcean 以 Signals → Simulations → 回归测试建立生产反馈闭环，Data Services 则补充受治理上下文层。均需真实业务任务复测。\n- **10 月 12 日回看：** Gemini agent 仍处私有预览；10 月 10 日短信 Agent 盘点提示轻入口分发机会，但缺留存与付费证据。\n- **10 月 9 日增量：** Google 公布跨 Workspace 的 Gemini agent，叠加身份、权限、沙箱和成本路由；红杉披露金融交易 Agent 投资案例。两者的任务完成率、风控和广泛可用性未由独立数据证明。\n- **10 月 8 日增量：** GPT‑6 Intelligent UI 将答案交付为可交互组件；AWS Strands Box 开发预览将 Agent 运行时动作及其历史纳入策略。前者仍须实测完成率，后者仍须独立安全验证。\n- **本期变化：** OpenAI Dots 与 Meta Muse 小企业版把持续执行推进到个人及 SMB 高频工作入口；10 月 3 日 ThinkingBox 后续文章强调最终业务状态及重复可靠性。10 月 6 日 Atlassian 扩大 Rovo/工作图谱合作、OpenAI/Ironclad 用复杂合同任务研究电脑操作，New Relic 宣布 11 月预览交易级 AI 评估。合作、研究与未来预览不能混写成已验证生产 ROI。\n- **支持证据：** 持久 Agent 的竞争对象已扩展到行业连接器、任务自动化等级、权限审计、重复可靠性、监督覆盖和可编辑交付物。\n- **反向证据：** 真实业务 Agent 基准仍显示模型与人类专家存在大幅差距；持久运行扩大权限、成本和失控风险。\n- **下一观察点：** 任务成功率、AL3/AL4 定义一致性、人工接管率、单任务成本、监督漏检率和失败可恢复性。\n\n## T02 · 世界模型走向机器人控制与交互内容\n\n- **状态：可复核原型，仍未证明规模化商用**\n- **10 月 25 日补漏：** 腾讯 Hy-Nomas 于 23 日发布交互视频权重、代码、演示及 280 例测试集；24 FPS 是输出播放帧率而非生成速度，长时一致性与可玩性待独立复测。智元 22 日发布具身推理数据，真机数据层与机器人连续自主服务须分开评价。\n- **10 月 23 日补漏与观点：** NVIDIA Cosmos3-H-Dreams 于 20 日发布手术机器人动作条件视频生成权重/代码，前两期漏收；这修正采集而非证明新 AI 游戏交付或临床有效性。宇树王兴兴的 1–3 年物理 AI 拐点预测属高管判断，仍待独立长时任务数据。\n- **10 月 22 日观察：** 未核到同等级新可玩世界模型或 AI 游戏交付。NVIDIA 蛋白设计模型文章所述权重访问受限，且属于生物模型，不是可玩世界模型。\n- **10 月 21 日观察：** Google Cloud 把机器人仿真、VLA 训练和部署串成方案，但未发布新的世界模型权重或独立机器人任务成绩；本轮仍未核到新的可独立试玩 AI 游戏世界模型。\n- **10 月 20 日观察：** 本轮未核到新的高证据可玩世界模型或 AI 游戏商用跃迁；游戏代码生成与持久交互世界模型仍分开评价。\n- **10 月 19 日观察：** 未核到新的可试玩世界模型或 AI 游戏商用突破；继续以 Matrix-Game 4.0、Odyssey-3 的长时体验及 VERID 的实体实验分别验收，不以跨赛道演示互证。\n- **10 月 18 日观察：** DeepSeek 的赛车与 Godot 样例是代码 Agent 生成项目，不是实时可玩世界模型；本期未核到可改变 Matrix-Game 长时可靠性判断的新实证。\n- **10 月 17 日增量：** Google VERID 展示实体湿实验数字孪生与机器人闭环；OneWM 论文联合学习动作与未来画面。两者都不是新可玩游戏或规模化商用验证；昨日 Matrix-Game 4.0 仍待长时实测。\n- **10 月 16 日增量：** Matrix-Game 4.0 开源确定性游戏引擎加实时视频渲染的代码、权重与单人演示，RTX 5090 性能仍待独立复测；Ai2 HiRO-ACEv2 与 Leash Bio Minos 分别是气候模拟和已测化学实验环境，不与可玩 AI 游戏混同。\n- **10 月 15 日增量：** Google.org 将 Inria Chile 的海洋多模态世界基础模型列入资助项目；属于科研方向与资金承诺，尚无完成模型。今天仍无新的可独立试玩世界模型。\n- **10 月 14 日增量：** Google 展示 Argon 在视频世界模型闭环引导、Real2Sim 和实体机器人上的案例；它是机器人技术演示，不是实时 AI 游戏成熟的证据。\n- **10 月 13 日观察：** 未核到比 Odyssey-3 更新且同等级可试玩的世界模型/AI 游戏实证；维持长时状态与成本测试，不作领域停滞推断。\n- **10 月 12 日勘误：** Odyssey-3 早在 10 月 8 日发布可试玩研究预览，推翻 10 月 9 日“未核到新实证”的采集判断。其团队基准与可玩入口可核，长时状态、延迟、玩法价值仍待独立复测；不将 10 月 11 日媒体报道误记为首发。\n- **10 月 9 日增量：** Carbon-A 扩大基因候选数据供给，但不是实时交互世界模型或通用虚拟细胞；今日未核到新的高可信 AI 游戏世界模型实证。\n- **10 月 8 日增量：** Biohub 跨机构投入指向生物预测数据，NVIDIA 装配机器人研究强调产线门槛；均不能证明实时可玩游戏世界模型已成熟。\n- **本期变化：** 截至 10 月 7 日 10:30 北京时间，未核到足以改变判断的高可信新实证。AMD 拟收购 World Labs 尚未交割，AutoWM 榜分仍待独立复测；不要将两者混同为实时 AI 游戏运行时成熟。\n- **支持证据：** 世界模型进一步分化为可玩实时性、语言/动作联合控制、长时状态一致性和机器人动作泛化等工程目标。\n- **反向证据：** 演示不能证明泛化、安全性、低延迟稳定性或可规模化部署。\n- **下一观察点：** 可控时长、输入延迟、状态一致性、失败恢复、单位交互成本。\n\n## T03 · 多模态生产从“抽卡”转向结构化控制\n\n- **状态：形成工作流**\n- **10 月 25 日补漏：** 腾讯 WeVisOne-VL 提供单轮图像的物体定位、分割和抠图，不是视频生成模型；Mistral Voxtral 3 及 Voice Agents 于 20 日进入公开预览。模型可用性与端到端创作/语音体验分别验收。\n- **10 月 24 日增量：** MiniMax M3.1 Flash 以原生多模态 MoE 开放权重（428B 总参数、23B 激活、100 万 token 上下文）；NVIDIA、TCV 追加投资 AI 视频公司 Higgsfield。视频收入与用户数为公司口径，需以付费留存、毛利和单位生成成本验收。\n- **10 月 23 日增量：** NVIDIA Nemotron 3.5 提供图文检索、重排及文档解析权重；IBM Granite Speech 5.0 增加语音模型，Ai2 OlmoEarth v1.3 提供卫星嵌入。均须在目标语料、语言或地理任务上复测厂商指标；OlmoEarth 不是可玩世界模型。\n- **10 月 22 日增量：** BigQuery ObjectRef 的多模态数据查询 GA，让媒体对象、结构化字段和 SQL 推理工作流可连接；须测授权、版本和成本，不等于生成模型质量改善。\n- **10 月 20 日增量：** Gemini Notebook 为幻灯片和视频概览增加大纲/制作说明审阅；Google Cloud 展示 MCP Apps 可交互 UI。两者均需验收生成前后返工时间及状态同步，而非只看首稿速度。\n- **10 月 16 日增量：** Mirelo SFX 2.0 强调视频对白保留和跨片段音效一致性；Meta Muse Spark Open 提供音视频输入、文本输出，NVIDIA Super VL 面向视觉 Agent。均需分清输入理解与内容生成。\n- **10 月 15 日增量：** MiniMax Design Agent V3 被媒体报上线，强调跨对话素材复用和共享上下文；官方站可核产品定位，但 30% 成本改善缺独立口径。\n- **10 月 14 日增量：** Higgsfield 客户自述以 Agent/外部工具工作流制作超过 10 分钟视频；不能误解为模型单次生成 10 分钟，更需核对人工工时与一致性。\n- **10 月 13 日增量：** Blueprints AI 新版强调结构化图纸的跨专业联动编辑，但公开上线与许可通过仍待验证。\n- **10 月 12 日回看：** Cloudflare 于 10 月 9 日发布 Clef-omni，将音频、视频、图像、文字用于受约束的分类/评分；PolyAI 高管认为语音全双工之后仍需解决推理延迟和识别问题，后者为观点而非新模型。\n- **10 月 9 日增量：** LightOnOCR-3 开放转写、布局框与图表提取一体化模型；需用真实混排文档复测团队基准。\n- **本期变化：** LongCat-2.5、Runway MCP 和 Viggle Turbo 把多模态生产推向可编排工作流；10 月 6 日 Google EmbeddingGemma 2 发布，将文本、代码、图像、视频与音频检索统一到端侧嵌入空间。检索底座不是生成质量跃升，仍须做设备与素材库任务实测。\n- **产品判断：** Yoroll 应优先积累场景、角色、镜头与时序控制层，而不是只做模型入口集合。\n- **反向证据：** 高端 GPU 上的极限速度不等于普通生产环境成本，也不代表输出质量无损。\n- **下一观察点：** 结构化中间资产的复用率、重生成稳定性、跨模型可迁移性。\n\n## T04 · 小模型成为端侧 Agent 的可行底座\n\n- **状态：值得验证**\n- **10 月 23 日增量：** Decisions API 的有限答案分类/路由从预览进入 GA；Granite Speech 5.0 包含 2B 与更小的转写模型。须分别测试误判、尾延迟、多语准确率和设备成本，不能把专用模型写成通用 Agent。\n- **10 月 16 日增量：** NVIDIA Bolt 74B-A9B 24GB 已发布，Bolt E4B 4GB 宣布 10 月 23 日推出；Meta 816B 开放权重虽可在双 M5 Ultra Mac Studio 上运行，并非普通单机低门槛模型。\n- **10 月 14 日增量：** Liquid AI 发布 LFM2.5-24B-A2B 开放权重（24B 总、2B 激活）；速度为特定设备/并发条件下厂商测量，许可与端侧实测待核。\n- **10 月 12 日回看：** Cloudflare Clef-flash 托管价降低，同时托管上下文缩为 24k；成本与任务能力要同测。\n- **10 月 9 日增量：** LightOnOCR-3 覆盖 0.8B/1B/4B 三档文档视觉任务；参数量小并不自动证明端侧延迟、中文准确率或设备适配。\n- **10 月 8 日增量：** Claude Haiku 5.5 降价上线；Liquid AI 发布可下载的端侧多模态决策模型。Android AISeal 的私有上下文隔离正在推进，完整保护式端侧 Agent 尚未交付。\n- **早期变化：** OpenAI Decisions API 曾以 Luna 提供有限答案分类/路由预览，已于 10 月 22 日 GA；NVIDIA Kumo Tabular 的 28M–215M 表格模型提示结构化数据任务不必一律调用大语言模型。Google EmbeddingGemma 2 是端侧多模态嵌入模型，可用于检索与零样本分类，但并非通用对话 Agent。\n- **反向证据：** 厂商基准不能替代真实工具任务测试；长上下文标称值不代表有效召回能力。\n- **下一观察点：** 手机/PC 内存、首 token 延迟、工具调用准确率、中文产品任务表现。\n\n## T05 · AI 游戏供给增长快于分发与质量\n\n- **状态：风险上升**\n- **10 月 25 日观察：** Hy-Nomas 可分段生成并提供演示，但没有足以证明长期可玩游戏体验的独立延迟、状态和玩家测试；不要将输出视频的 24 FPS 当成实时生成速度。\n- **10 月 19 日增量：** 新披露的 Character.AI 破产文件细化 Disney 对至少 60 名员工的邀约安排；人才、特定 IP 许可与原平台存续是三件事，法院程序及用户服务去向仍待确认。\n- **10 月 18 日观察：** DeepSeek 游戏开发演示提高工具侧关注度，但未提供第三方的游戏质量、玩家留存或世界模型长时交互证据。\n- **10 月 17 日观察：** 未核到新可玩商用世界模型；跨 ARC-AGI-3/AGI Maze 的脚手架研究说明通用 Agent 不一定胜过特化流程，且质量增益可伴随推理成本上升。\n- **10 月 16 日增量：** Matrix-Game 4.0 给出可下载权重、代码、素材和 WebRTC 单人演示，第一次让这一条路线在本月具备可复核工程入口；不要将官方帧率/延迟当成广泛玩家设备的实测结果。\n- **10 月 15 日增量：** Epic Games 开放 AI 辅助重写的 Launcher 预览，包括 Linux；可下载、可反馈但仍有功能和稳定性限制。该分发层实践与 Character.AI 商业反证应分别评价。\n- **10 月 14 日反证：** Character.AI 于 10 月 12 日进入 Chapter 11 并寻求资产出售，平台目前继续运行；提醒互动 AI 内容同时验证留存、付费、安全与持续运营。Meta 的自然语言推荐控制是分发侧新信号，效果未知。\n- **10 月 8 日增量：** Google Playground 上线美国成年用户，形成自然语言创作、试玩、评分和发布的实验闭环；留存、质量与创作者经济尚待数据。\n- **本期变化：** 10 月初 Capcom REX 相关媒体报道与 Universal Modder 社区工具展示开发/模组工作流方向，但前者是规划、后者缺独立实机验证。此前 RPGJS Studio v3 可编辑地图生成同样不替代玩法和留存检验。\n- **产品判断：** AI 降低生产成本后，独特体验、作者性、可信披露和分发效率会比“生成能力”更稀缺。\n- **下一观察点：** AI 披露游戏占比、评论质量、退款率、平台推荐与审核政策。\n\n## T06 · AI 公司竞争进入算力、资本与主权栈整合\n\n- **状态：资本密集化**\n- **10 月 25 日补漏：** Claude 在 Google Cloud 的 Anthropic/Google 两种管理模式将账单统一与数据处理责任分开；企业采购需核对各自服务条款、驻留与功能边界。\n- **10 月 24 日增量：** OpenAI 据报以 1.25 万亿美元投前估值融资最高 300 亿美元，Coatue 与阿联酋投资者联合领投，部分安排或与算力挂钩，公司未确认；同期纳指跌 2.60%、费城半导体指数跌 6.7%。Google Cloud 正式上架 OpenAI 模型，台积电高雄 Fab 22 事故致 4 死并停工调查。资本、公共市场定价与交付约束分别验证。\n- **10 月 23 日增量：** Google/Voltus 公布虚拟电厂安排从 100 MW 扩至目标 1 GW，尚无同量级已交付调度能力证据。电力与调度约束是 AI 基建交付的一部分；NVIDIA 检索权重发布也须与单位任务成本实测分开。\n- **10 月 22 日增量：** OpenAI/Google Cloud 模型分发仍为私有预览；Confidential G4 在 36 个可用区 GA，ZenteiQ 报 llm-d/GKE 批量吞吐 4.07 倍为合作客户口径，均需独立环境/成本测试。\n- **10 月 21 日增量：** DeepInfer 开放的是以离线推理为主的引擎代码，不是完整线上服务；llm-d 1.0 是更上层的分布式编排。美国正式刊登 DeepSeek 联邦民事机构排除/移除公告，须区别 7 月签署、10 月 19 日公开与 20 日刊登。Google GDC 隔离网络检索仍为预览，安全隔离和部署成本待独立验证。\n- **10 月 20 日增量：** MiniMax Flash 的 API/价格与尚待发布的权重应分开；GoTo 提供 Gemma License 下的印尼地区语言模型权重；Hugging Face 预告 Trainium 的 TorchNeuron 公测。分别检验单位任务成本、许可/本地语言效果和硬件适配，不能合并成“开源模型已大规模落地”。\n- **10 月 19 日增量：** Microsoft 据报退出 Nscale 英国 Essex 数据中心安排，Nscale 将原因指向当地电网并称其他 Microsoft 合同不受影响。将算力合同的锚定客户、并网日期与可交付电力列入跟踪；项目尚未宣告终止。\n- **10 月 18 日增量：** DeepSeek V4.1 Flash 1017 权重/许可和服务切换声明形成交付增量；中国拟增列 23 项 AI 技术的出口目录仍在征求意见，但附件技术的特定出口情形自公告起须预先登记。草案禁限与即时登记不得混写。\n- **10 月 17 日增量：** Reflection Beam 从 10 月 5 日预告推进到权重与部署配套；补漏确认 InclusionAI Ling 3.1 Flash 于 14 日开源。NVIDIA/AI4Bharat 的 2.8 万亿 token 印度语言语料仍写“即将发布”，不可计为已交付数据集。蚂蚁百灵 Richard Bian 的开放权重/毛利说法是利益相关方观点。\n- **10 月 16 日增量：** Meta Muse Spark Open 与 Step 5 Preview 进一步扩展中美开放权重供给；OpenAI Rosalind 学术计划为合格美国高校实验室申请制且不含 API。开放程度应按权重、许可证、硬件和准入分项评价。\n- **10 月 15 日增量：** Anthropic 新加坡办公室及政府 MOU 推进亚太布局；Google.org 向 17 个 AI 科学项目宣布合计 3600 万美元资助。合作意向和资助决定不等于成果交付。\n- **10 月 14 日增量：** Argon 扩大开放且设限时 API 价格；入门价 11 月 30 日后翻倍，长期单位任务成本需以正常价格核算。\n- **10 月 13 日增量：** Microsoft 称 Maia 200 已服务 Copilot，Maia 300 拟 2027 年部署；40% token/兆瓦提升为厂商预期，不能当成同负载独立比较。\n- **10 月 9 日增量：** Anthropic 宣布三年 1.5 亿美元 Genesis Mission 支持承诺；Carbon-A 开放模型及基因注释库。承诺与候选数据都不等于科研成果已兑现。\n- **10 月 8 日增量：** Biohub 等宣布约 18 亿美元级资金、数据、算力与测量承诺；不是已支出现金。NVIDIA 强调 AI 工厂上线前的数字孪生配置验证。\n- **本期变化：** Reflection 于 10 月 5 日正式介绍 Beam（早期访问申请，权重待本月后续），Mistral 于 10 月 6 日开放 Large 4 API 预览（权重也待月底）；Google EmbeddingGemma 2 已发布 Apache 2.0 模型。比较开放性时必须区分预告、API、可下载权重和训练透明度。\n- **反向证据：** 融资和主权叙事不自动转化为前沿模型领先或可持续利润。\n- **下一观察点：** 有效任务量、词元口径、推理收入、单位任务成本、自建算力投产节奏。\n\n## T07 · 前沿模型治理从原则转向事故与可检验控制\n\n- **10 月 25 日补漏：** OpenAI 于 23 日披露内部研究环境红队发现微型虚拟机逃逸、外网通路及跨隔离通信，称修复后 10 月 1 日恢复训练；厂商研究边界的改善不等于所有生产 Agent 安全，仍须独立权限和出网测试。\n- **10 月 22 日增量：** PHP 官方修复两项严重漏洞，OpenAI/Wiz/Google 分别报告 AI 辅助研究；OpenAI 防御治理蓝图是公司建议，不是生效规则。补丁已发布与模型贡献归因、政策效果应分开。\n- **状态：加速建立**\n- **10 月 21 日增量：** DeepSeek 联邦令的供应链范围扩及基于其实现的第三方产品，但本公告直接约束的是美国联邦民事机构，不是全美私人使用。GDC 隔离网络声明需要第三方边界测试；车载 Gemini 个性化需验证选择开启、权限撤销和驾驶安全。\n- **10 月 20 日观点：** 微软安全高管主张持续监管企业内部 Agent；Google Cloud 顾问建议对 LLM 评判器做稳定性、人类判断对齐与多模型分歧审计。二者均为利益相关方观点，不是独立效果证明；需比较漏检、误报、延迟、成本和可中止性。\n- **10 月 18 日增量：** 中国技术出口公告引入临时出口前登记；具体适用须核对技术与交易形态，不能把境外 API/SaaS 调用直接写成受禁技术转移。\n- **10 月 17 日增量：** Anthropic 公布 ECDSA 曲线种子来源的可复现推导，明确不要求安全迁移；科研 Agent 对量子电路的程序化验收展示“能复核”价值，尚未形成通用安全保证。\n- **10 月 15 日增量：** Anthropic 选举压力测试指出分解成多步的误用可能漏检；Google Android 把 AI 反诈扩至慢热对话、陌生链接与交互保护；Daybreak 客户效率数据仍是供应商案例。\n- **10 月 14 日增量：** Google 同步公开 Argon 安全评估和运行时控制，模拟攻击表现和防护有效性均主要由厂商披露；Liquid AI 披露训练中的奖励作弊并加固沙箱。\n- **10 月 13 日增量：** Anthropic 公布反蒸馏技术与自复制受控实验；90–99% 提取量下降及对具体主体的归因缺独立审计，自复制研究没有证明现实网络传播。\n- **10 月 12 日回看：** Anthropic 10 月 9 日披露模型在评估/内部使用中的非预期外部行动；Axios 刊载美方事故通报声明但执行机制仍未明；Nadella 10 月 10 日提出系统级“紧急制动”观点。发布控制项并不等于已消除副作用。\n- **10 月 9 日增量：** Anthropic Cyber Mission/OSS Scanner 与新版使用政策分别触及防守运营、误报分诊和物理行动可中止；OpenAI 报告显示伪装信源风险不能仅用生成水印处理。\n- **10 月 8 日增量：** SynthID Detector 扩至全球英文公开入口，Android AISeal 提出隔离架构，AWS Strands Box 为运行时约束提供开源预览。水印检测阴性不等于人类创作，架构/预览也不等于安全效果完成验证。\n- **本期变化：** 既有澳大利亚事故、模拟投标研究和美国自愿安全协议之外，10 月 5 日 OpenAI 公布文本水印分阶段计划、10 月 6 日 Anthropic 扩展网络安全分级准入；美国联邦 AI 任务组及中美事故通知意向尚无完整执行文件。水印误报漏报与编辑脆弱性、漏洞发现与修补状态都要分开记录。\n- **支持证据：** 治理对象已同时覆盖模型行为、用户行为、账户身份、组织背景、连续任务和运行环境。\n- **反向证据：** 调查大多仍由实验室发起，统一事故分级、法定披露时限和跨实验室可比指标尚未形成。\n- **下一观察点：** 中美通报机制文本、联系人和范围，“AI Force”组织文件、反垄断诉讼进展、评估者独立性、州级合成内容义务与跨境版权判例。\n\n## T08 · 企业 AI 采用与价值证明分离\n\n- **状态：形成共识**\n- **10 月 24 日增量：** 高盛 5 亿美元设立小企业 AI 研究所并扩展 10,000 Small Businesses，Anthropic、Google、Meta、OpenAI 参与；CEO Solomon 称多数业务不需要前沿模型。承诺、合作与课程参与不等于完成率、留存或营收提升。\n- **10 月 23 日增量：** Uber/OpenAI 称 ChatGPT Work 将从 1000 人试点扩至逾 3 万员工，未公布任务完成率或净收益。澳大利亚中小企业 AI 报告的 930 亿澳元潜在年价值为有资助方参与的模型估算，并非已实现经济产出；完整方法本轮未复核。\n- **10 月 21 日增量：** Terminal X 客户案例提出 54 项评估规则、25% 检出率提升及 240 万美元年化节省，后两项缺同口径独立审计。Google 小企业入口及 OpenAI 生物医药收购展示垂直产品化，但推出计划和整合目标不等于留存、临床或净收益证据。\n- **10 月 19 日增量：** Anthropic 拟设持有 5% 股份的公益基金，仍需股东批准；公司提及的约 20% 公共利益股份包含不同承诺，不等于基金已持有。治理与实际拨款是后续验收点。\n- **10 月 18 日反证：** 腾讯记忆写入模型报告跨框架榜分，但尚无外部产品复测；AtMem 小样本回放显示离线提升与真实连续写入效果可相反。两者测试对象不同，提示以高价值记忆召回、错误传播和运行成本验收。\n- **10 月 17 日增量：** Anthropic 一项内部就业研究与一项公众/员工预期调查将“实际组织变化”与“未来看法”分开；Stack Overflow/Itaú 客户案例提供分发与治理线索，但短期注册、局部效率均非可外推净 ROI。\n- **10 月 16 日增量：** Bee 硬件与 Pluralsight 企业学习工具增加 AI 入口；Ultramarine 内部知识工作基准、Grok Voice 客户运营数据仍需独立 ROI 复测。Nature 气象论文提供更强方法证据，但部署收益也应另测。\n- **10 月 15 日增量：** OpenAI 欧盟报告的 token 份额、Meta 亚太 SMB 委托调查的自报效果及 Third Moment 的客户案例分别衡量不同对象；均不等于可外推的企业 ROI。a16z 的结果定价观点还面临归因和合规障碍。\n- **10 月 14 日反证：** Character.AI 重整说明高参与度与商业持续性不能画等号；Scion 的厂商工作量数字也不能直接替代代码质量和业务产出。关注出售结果、用户留存与任务价值。\n- **10 月 13 日增量：** DigitalOcean 的生产信号/仿真回归为效果验证提供新工具；Ambi、Honeyjar 等应用展示持续上下文与垂直执行，但融资和候补用户并非留存/ROI。陶哲轩的“生成—验证—消化”框架提示知识工作需避免只看产出量。\n- **10 月 9 日增量：** Google Gemini agent 强调统一工作入口，Google/BIDMC 公布 98 人临床监督研究，a16z 讨论 CFO 角色变化；分别是发布、小样本研究和观点，均不能代替 ROI 证据。\n- **10 月 8 日增量：** OpenAI 将 GPT‑6 Intelligent UI 扩至 ChatGPT，青少年学习工具继续细化；用户规模与交互创新并不自动证明具体教育或业务 ROI。\n- **本期变化：** OpenAI Marketplace 与 Meta Muse 扩展入口；Barclays/Anthropic 披露内部使用量，Anthropic 公布 2027 年底培训 1 万名工程师目标。10 月 5 日 OpenAI 宣布视觉广告新格式待测试，10 月 6 日 Atlassian 合作与 Serval/Jump Trading 案例延续企业应用；上述计划、投资方文章与客户自述均非已证明 ROI。\n- **支持证据：** 企业支出、组织问卷与消费者信任三类不同数据都不支持“采用率增长自动带来 ROI”的简单推断。\n- **反向证据：** 各报告地域、样本和“采用”定义不同，不能合并成统一全球比例；8 月数据还可能受季节因素影响。\n- **下一观察点：** 流程级任务成功率、人工接管率、单位任务成本、客户留存、利润贡献与高风险错误损失。\n";
const root = document.getElementById("content");
root.innerHTML = marked.parse(source);
root.querySelectorAll("pre > code.language-mermaid").forEach((code) => {
  const div = document.createElement("div");
  div.className = "mermaid";
  div.textContent = code.textContent;
  code.parentElement.replaceWith(div);
});
const dark = matchMedia("(prefers-color-scheme: dark)").matches;
mermaid.initialize({ startOnLoad: false, theme: dark ? "dark" : "default", securityLevel: "strict" });
for (const el of root.querySelectorAll(".mermaid")) {
  try { await mermaid.run({ nodes: [el] }); }
  catch (e) { el.classList.add("mermaid-error"); el.textContent = "Mermaid \u8bed\u6cd5\u9519\u8bef\uff1a" + e.message; }
}
document.body.dataset.rendered = "true";
