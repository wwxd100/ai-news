<style>
  :root { color-scheme: light dark; --fg:#1f2328; --bg:#fff; --muted:#656d76; --line:#d0d7de; --code:#f6f8fa; }
  @media (prefers-color-scheme: dark) { :root { --fg:#e6edf3; --bg:#0d1117; --muted:#8d96a0; --line:#30363d; --code:#161b22; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.7 -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif; }
  main { max-width:960px; margin:0 auto; padding:40px 24px 80px; }
  h1,h2,h3 { line-height:1.3; } h1,h2 { border-bottom:1px solid var(--line); padding-bottom:.3em; }
  a { color:#0969da; } blockquote { margin:0; padding:0 1em; color:var(--muted); border-left:4px solid var(--line); }
  code { background:var(--code); padding:.15em .4em; border-radius:6px; font-size:.9em; }
  pre { background:var(--code); padding:16px; border-radius:8px; overflow:auto; } pre code { padding:0; }
  table { border-collapse:collapse; display:block; overflow:auto; }
  th,td { border:1px solid var(--line); padding:6px 12px; }
  .language-switch { max-width:960px; margin:0 auto; padding:16px 24px 0; text-align:right; }
  .language-switch a { margin-left:12px; }
  .language-switch [aria-current="page"] { color:var(--fg); font-weight:600; text-decoration:none; }
  .mermaid { display:flex; justify-content:center; margin:24px 0; padding:16px; border:1px solid var(--line); border-radius:12px; overflow:auto; }

</style>

<main id="content"></main>
<script type="module">
import { marked } from "https://cdn.jsdelivr.net/npm/marked@12/lib/marked.esm.js";
import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";
const source = "<div align=\"center\">\n<h1>AI News<\/h1>\n<p>面向产品决策与内容选题的全球 AI 行业资讯与研究简报<br>兼顾投资观察与技术背景梳理<\/p>\n<p><a href=\"README.md\">English<\/a> · <strong>中文<\/strong><\/p>\n<p><a href=\"daily/2026-10/2026-10-22.md\">阅读最新日报<\/a> · <a href=\"weekly/2026-W42.md\">阅读 W42 周报<\/a> · <a href=\"INDEX.md\">浏览完整索引<\/a><\/p>\n<\/div>\n\n---\n\n每日覆盖大语言模型（LLM）、多模态模型与世界模型、AI 应用、AI 游戏、公司动态、研究报告及专家观点。优先一手信源，标注发布时间、独立交叉验证情况、可信度和趋势状态。10 月 18 日起的新日报同步提供中英文完整版本；此前档案暂为中文。\n\n## 当前关键趋势\n\n**今日新增：** [OpenAI 模型进入 Google Cloud](daily/2026-10/2026-10-22.md)仍为部分企业私有预览，并非全面发布。[PHP 修复两项严重漏洞](daily/2026-10/2026-10-22.md)显示 AI 辅助研究进入真实上游修复；[NVIDIA OpenShell](daily/2026-10/2026-10-22.md)提供可检查的 Agent 控制架构，不等于安全性已独立证明。\n\n1. **政策边界开始影响模型供应链，而非仅是 App 访问。** [美国《联邦公报》的 DeepSeek 令](daily/2026-10/2026-10-21.md)针对联邦民事机构采购与 IT 系统，也包含特定第三方实现；不是美国私人使用全面禁令。7 月签署与 10 月刊登应分清。\n2. **模型竞争从发布转向单位任务成本。** [DeepInfer 与 llm-d 1.0](daily/2026-10/2026-10-21.md)在不同层级开放推理软件；[MiniMax M3.1 Flash](daily/2026-10/2026-10-20.md)已有 API，但权重未发布。按许可、硬件、质量、重试和完整任务成本比较；厂商榜分不是独立实测。\n3. **世界模型分化为可玩工程、机器人控制和实验数字孪生。** [Matrix-Game 4.0](daily/2026-10/2026-10-16.md)已有单人演示；[Google Cloud 机器人方案](daily/2026-10/2026-10-21.md)是仿真到部署工具链，不是新可玩世界模型。都不能替代长期玩家测试。\n4. **Agent 竞争扩展到工具、上下文和垂直流程。** [Orchestra Bio 收购及 Gemini 车载/小企业入口](daily/2026-10/2026-10-21.md)扩大分发；[DeepSeek Search/Fetch 与腾讯记忆写入模型](daily/2026-10/2026-10-18.md)增加基础设施选项。须验收权限、状态质量、延迟及任务成本。\n5. **采用、治理与经济价值仍需分层。** [Terminal X 的 54 项评估案例](daily/2026-10/2026-10-21.md)是可借鉴的流程，不是独立审计的收益；Anthropic [公益基金拟议股权安排](daily/2026-10/2026-10-19.md)仍待批准和执行披露。\n6. **多模态生产走向可编排、可审阅的工作流。** [Gemini Notebook 的大纲与制作说明审阅](daily/2026-10/2026-10-20.md)增加生成前检查点。跨任务素材复用和跨片段声音一致性仍应以返工时间和成片质量验收。\n7. **安全、部署和交付约束变得具体。** [中国技术出口目录草案与即时登记](daily/2026-10/2026-10-18.md)必须区分；[GDC 隔离网络检索预览](daily/2026-10/2026-10-21.md)需要独立边界验证；[Nscale 供电瓶颈](daily/2026-10/2026-10-19.md)说明宣布的算力不等于按期交付。\n\n```mermaid\nflowchart LR\n  A[\"模型、工具与政策增量\"] --> B[\"任务质量和适用边界\"]\n  B --> C[\"产品决策与内容选题\"]\n  D[\"反证、成本与长期验证\"] --> B\n```\n\n## 历史内容\n\n- [2026-10-22 AI 日报](daily/2026-10/2026-10-22.md) · [English](en/daily/2026-10/2026-10-22.md)\n- [2026-10-21 AI 日报](daily/2026-10/2026-10-21.md) · [English](en/daily/2026-10/2026-10-21.md)\n- [2026-10-20 AI 日报](daily/2026-10/2026-10-20.md) · [English](en/daily/2026-10/2026-10-20.md)\n- [2026-10-19 AI 日报](daily/2026-10/2026-10-19.md) · [English](en/daily/2026-10/2026-10-19.md)\n- [2026-W42 AI 周报](weekly/2026-W42.md) · [English](en/weekly/2026-W42.md)\n- [2026-10-18 AI 日报](daily/2026-10/2026-10-18.md) · [English](en/daily/2026-10/2026-10-18.md)\n- [2026-10-17 AI 日报](daily/2026-10/2026-10-17.md)\n- [完整历史索引](INDEX.md) · [持续趋势追踪](TRACKERS.md) · [采集与筛选方法](METHODOLOGY.md)\n\n> 本仓库提供研究信息，不构成投资、医疗或法律建议。关键决策请回到原始信源复核。\n";
const root = document.getElementById("content");
root.innerHTML = marked.parse(source);
root.querySelectorAll("pre > code.language-mermaid").forEach((code) => {
  const div = document.createElement("div");
  div.className = "mermaid";
  div.textContent = code.textContent;
  code.parentElement.replaceWith(div);
});
const dark = matchMedia("(prefers-color-scheme: dark)").matches;
mermaid.initialize({ startOnLoad: false, theme: dark ? "dark" : "default", securityLevel: "strict" });
for (const el of root.querySelectorAll(".mermaid")) {
  try { await mermaid.run({ nodes: [el] }); }
  catch (e) { el.classList.add("mermaid-error"); el.textContent = "Mermaid \u8bed\u6cd5\u9519\u8bef\uff1a" + e.message; }
}
document.body.dataset.rendered = "true";
</script>
</body>
</html>
